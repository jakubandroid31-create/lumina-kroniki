name: Wersja www (GitHub Pages)

# Buduje web/index.html z src/ (python3 build.py) i publikuje folder web/ na gałąź gh-pages –
# GitHub wyświetla ją jako stronę z grą.
on:
  push:
    branches: [main]
    paths: ['web/**', 'src/**', 'build.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Budowanie web/index.html z src/
        run: python3 build.py

      - name: Wyślij web/ na gałąź gh-pages
        run: |
          cd web
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publikacja wersji www (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
