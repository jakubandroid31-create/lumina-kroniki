   +row(t('m_h_cam'),p('rotL')+p('rotR'))+row(t('m_h_zoom'),p('zoomIn')+p('zoomOut'))+`</table></div>`;
  h+=`<div><h3>${t('m_h_mouse')}</h3><p>${t('m_h_mouse1')}</p><p>${t('m_h_mouse2')}</p><p>${t('m_h_mouse3')}</p></div>`;
  h+=`<div><h3>${t('m_h_touch')}</h3><p>${t('m_h_touch1')}</p><p>${t('m_h_touch2')}</p><p>${t('m_h_touch3')}</p></div></div>`;
  h+=`<h3>${t('m_h_goal')}</h3><p>${t('m_h_goal_d')}</p>`;
  h+=`<h3>${t('m_h_types')}</h3><p>${t('m_h_types_d')}</p>`;
  if(typeof TYPES!=='undefined'&&typeof effOf==='function'){const tn=x=>typeof TYPE_N!=='undefined'&&TYPE_N[x]?L2(TYPE_N[x]):x;
    const badge=x=>`<span class="ds-ty" style="background:${typeof TYPE_COL!=='undefined'&&TYPE_COL[x]?TYPE_COL[x]:'#aaa'}">${_mEsc(tn(x))}</span>`;
    h+='<table>';for(const a of TYPES){const s=TYPES.filter(d=>effOf(a,d)>1);if(!s.length)continue;h+=`<tr><td>${badge(a)}</td><td><i>${t('m_h_strong')}</i> ${s.map(badge).join(' ')}</td></tr>`;}h+='</table>';}
  h+=`<h3>${t('m_h_shrines')}</h3><p>${t('m_h_shrines_d')}</p><h3>${t('m_h_catch')}</h3><p>${t('m_h_catch_d')}</p><h3>${t('m_h_save')}</h3><p>${t('m_h_save_d')}</p>`;
  return`<div class="ds-text">${h}</div>`;}
function showHelp(){
  const o=dsScreen({cls:'ds-help',title:()=>t('m_help_title'),noDesc:true,menuCloses:true,html:_mHelpHTML,rows:()=>[],
    onInput:(a,rep)=>{const b=o.el.querySelector('.ds-body');if(a==='up'||a==='down'){b.scrollBy({top:(a==='up'?-1:1)*Math.max(60,b.clientHeight*.4),behavior:'smooth'});return true;}
      if(a==='ok'&&!rep){_mSfx('back');o.close();return true;}return false;},
    hints:()=>{const d=_mDev();return(d==='touch'||d==='mouse')?[{a:'back',l:t('m_close')}]:[{a:['up','down'],l:t('m_scroll')},{a:'back',l:t('m_close')}];}});
  o.render();_mPush(o);return o.promise;}

// ---------- credits ----------
function showCredits(opt){opt=opt||{};const ending=!!opt.ending;
  const o=dsScreen({cls:'ds-cred',noDesc:true,menuCloses:true,rows:()=>[],
    html:()=>{const c=(h,v)=>`<div class="h">${_mEsc(h)}</div><div class="v">${_mEsc(v)}</div>`;
      return`<div class="ds-crv"><div class="ds-crs">${ending?`<div class="v g">${_mEsc(t('m_thanks'))}</div><div class="end">${_mEsc(t('m_end_text'))}</div><div style="height:40px"></div>`:''}
        <div class="big">LUMINA</div><div class="v s">${_mEsc(t('m_sub'))}</div><div class="v i">${_mEsc(t('m_sub2'))}</div>
        ${c(t('m_cr_design'),t('m_cr_design_v'))}${c(t('m_cr_music'),t('m_cr_music_v'))}${c(t('m_cr_art'),t('m_cr_art_v'))}${c(t('m_cr_fonts'),t('m_cr_fonts_v'))}${c(t('m_cr_thanks'),t('m_cr_thanks_v'))}
        <div style="height:60px"></div><div class="big" style="font-size:clamp(22px,4vw,40px)">${_mEsc(t('m_the_end'))}</div></div></div>`;},
    wrap:(o)=>{const b=o.el.querySelector('.ds-body');b.style.overflow='hidden';b.style.display='flex';b.style.flexDirection='column';b.style.touchAction='none';
      const crv=o.el.querySelector('.ds-crv'),crs=o.el.querySelector('.ds-crs');o._cy=o._cy==null?null:o._cy;let last=performance.now();
      o._crs=crs;o._crv=crv;if(o._raf)cancelAnimationFrame(o._raf);
      const step=ts=>{if(o.done)return;const dt=Math.min(.05,(ts-last)/1000);last=ts;const vh=crv.clientHeight,ch=crs.offsetHeight;
        if(o._cy==null)o._cy=vh*.85;const end=Math.min(vh*.5-ch+40,vh*.85-ch);const sp=(o._fast||0)+28;
        if(o._cy>end)o._cy=Math.max(end,o._cy-sp*dt);crs.style.transform=`translateY(${o._cy}px)`;o._raf=requestAnimationFrame(step);};
      o._raf=requestAnimationFrame(step);
      let py=null;crv.addEventListener('pointerdown',e=>{py=e.clientY;});crv.addEventListener('pointermove',e=>{if(py!=null&&o._cy!=null){o._cy+=e.clientY-py;py=e.clientY;}});
      crv.addEventListener('pointerup',()=>{py=null;});crv.addEventListener('wheel',e=>{if(o._cy!=null)o._cy-=e.deltaY*.5;},{passive:true});},
    onInput:(a,rep)=>{if(a==='down'){o._cy-=40;return true;}if(a==='up'){o._cy+=40;return true;}if(a==='ok'&&!rep){_mSfx('back');o.close();return true;}return false;},
    hints:()=>{const d=_mDev();return(d==='touch'||d==='mouse')?[{a:'back',l:t('m_close')}]:[{a:['up','down'],l:t('m_scroll')},{a:'back',l:t('m_close')}];}});
  if(ending)o.el.style.background='radial-gradient(ellipse at 50% 40%,rgba(27,47,107,.97),rgba(10,18,48,.98) 55%,#04070f)';
  o.render();_mPush(o);return o.promise;}

// ======== main.js ========
// ===================== MAIN (loop, resize, boot) =====================
let _fpsT=0,_fpsN=0,_fps=0,_last=0,_dispW=W,_dispH=H;
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;let cw,ch;
  if(SET.scaleMode==='stretch'){cw=vw;ch=vh;}
  else{let s=Math.min(vw/W,vh/H);if(SET.scaleMode==='integer'&&s>=1)s=Math.floor(s);cw=Math.round(W*s);ch=Math.round(H*s);}
  _dispW=cw;_dispH=ch;
  const portrait=vh>vw*1.1;const top=portrait?Math.max(0,Math.min((vh-ch)/2,vh*0.04)):Math.round((vh-ch)/2);
  for(const el of [cvs,document.getElementById('scan')]){el.style.width=cw+'px';el.style.height=ch+'px';el.style.left=Math.round((vw-cw)/2)+'px';el.style.top=top+'px';}
  const dpr=window.devicePixelRatio||1;
  RS=SET.res>0?SET.res:clamp(Math.ceil(cw*dpr/W),1,4);
  if(cvs.width!==W*RS){cvs.width=W*RS;cvs.height=H*RS;}
  if(typeof updateTouch==='function')updateTouch();
}
onApply(()=>{if(!cvs)return;resize();cvs.style.filter=SET.brightness!==100?`brightness(${SET.brightness}%)`:'';
  document.getElementById('scan').style.display=SET.scanlines?'block':'none';});
function canvasRect(){return cvs.getBoundingClientRect();}

function frame(ts){
  const tsec=ts/1000;let dt=_last?Math.min(0.05,tsec-_last):0.016;_last=tsec;DT=dt;_now+=dt;
  try{
    if(typeof inputPoll==='function')inputPoll(dt);
    if(typeof uiUpdate==='function')uiUpdate(dt);
    if(!topOverlay()){
      if(scene==='world'&&typeof worldUpdate==='function')worldUpdate(dt);
      else if(scene==='battle'&&typeof battleUpdate==='function')battleUpdate(dt);
    }
    if(game&&(scene==='world'||scene==='battle')&&!topOverlay())game.time+=dt;
    render();
  }catch(e){console.error(e);}
  _fpsN++;_fpsT+=dt;if(_fpsT>=0.5){_fps=Math.round(_fpsN/_fpsT);_fpsN=0;_fpsT=0;}
  requestAnimationFrame(frame);
}
function render(){
  ctx.setTransform(RS,0,0,RS,0,0);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(fx.shake>0&&SET.shake){ctx.translate((Math.random()-.5)*fx.shake,(Math.random()-.5)*fx.shake);}
  fx.shake=Math.max(0,fx.shake-DT*30);
  if(scene==='world'&&typeof worldRender==='function')worldRender();
  else if(scene==='battle'&&typeof battleRender==='function')battleRender();
  else if((scene==='story'||scene==='ending')&&typeof storyRender==='function')storyRender();
  else if((scene==='title'||scene==='splash')&&typeof titleRender==='function')titleRender();
  ctx.restore();
  if(typeof uiRender==='function')uiRender();
  if(SET.showFps){ctx.font='8px monospace';ctx.textAlign='right';ctx.textBaseline='top';ctx.fillStyle='#000a';ctx.fillRect(W-40,0,40,11);ctx.fillStyle='#7f7';ctx.fillText(_fps+' FPS',W-3,2);}
}
function boot(){
  cvs=document.getElementById('c');ctx=cvs.getContext('2d');
  loadSettings();
  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',()=>setTimeout(resize,200));
  document.addEventListener('visibilitychange',()=>{if(typeof applyAudio==='function')applyAudio();});
  if(typeof setupInput==='function')setupInput();
  if(typeof setupTouch==='function')setupTouch();
  applySettings();resize();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
  const go=()=>{if(typeof showSplash==='function')showSplash();requestAnimationFrame(frame);};
  if(document.fonts&&document.fonts.ready){Promise.race([document.fonts.ready,sleep(2500)]).then(go);}else go();
}
window.addEventListener('load',boot);

</script>
