function hexToRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function rgbToHex(r,g,b){return'#'+((1<<24)|(clamp(r|0,0,255)<<16)|(clamp(g|0,0,255)<<8)|clamp(b|0,0,255)).toString(16).slice(1);}
function shade(h,f){let[r,g,b]=hexToRgb(h);if(f>=0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}else{r*=1+f;g*=1+f;b*=1+f;}return rgbToHex(r,g,b);}
function hueShift(h,deg,sat=0){let[r,g,b]=hexToRgb(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let hh=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;hh*=60;}
  hh=((hh+deg)%360+360)%360;s=clamp(s+sat,0,1);const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((hh/60)%2-1)),m=l-c/2;
  const[R,G,B]=hh<60?[c,x,0]:hh<120?[x,c,0]:hh<180?[0,c,x]:hh<240?[0,x,c]:hh<300?[x,0,c]:[c,0,x];return rgbToHex((R+m)*255,(G+m)*255,(B+m)*255);}

function saveToSlot(s){if(!game)return false;game.slot=s;const lead=game.party[0];
  const meta={date:Date.now(),li:game.pos.li,lead:lead?lead.sp:null,lv:lead?lead.lv:0,cleared:game.cleared.length,time:Math.floor(game.time),name:game.name};

function deleteSlot(s){localStorage.removeItem(_sk(s));}
function latestSlot(){let best=0,bd=-1;for(let s=1;s<=SLOTS;s++){const m=slotMeta(s);if(m&&m.date>bd){bd=m.date;best=s;}}return best;}

function exportSlot(s){const raw=localStorage.getItem(_sk(s));if(!raw)return false;const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='lumina-save-'+s+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return true;}
function importToSlot(s,file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);
  if(!d||!d.data||!Array.isArray(d.data.party))return res(false);localStorage.setItem(_sk(s),JSON.stringify(d));res(true);}catch(e){res(false);}};fr.onerror=()=>res(false);fr.readAsText(file);});}

// ===================== ROUTING =====================
function dispatch(a,rep){
  if(scene==='splash'){if(!rep&&typeof splashAny==='function')splashAny();return;}
  const o=topOverlay();if(o){o.input(a,rep);return;}
  if(ui.length){const w=ui[ui.length-1];if(w.input)w.input(a,rep);return;}
  if(scene==='world'&&typeof worldInput==='function')worldInput(a,rep);
}
function routeMouse(ev){
  if(topOverlay())return;
  if(ui.length){const w=ui[ui.length-1];if(w.mouse&&w.mouse(ev))return;if(scene!=='world')return;
    // dialog boxes swallow clicks
    if(ev.type==='click'||ev.type==='down')return;}
  if(scene==='world'&&typeof worldMouse==='function')worldMouse(ev);
}

  if(id==='eclipsor'||id==='eclipsor2')raw.push([50,'eclipse']);
  const seen={},out=[];
  for(const e of raw){if(seen[e[1]])continue;seen[e[1]]=1;out.push(e);}
  return(_lsCache[id]=out);
}
function _mvScore(id){const m=MOVES[id];if(!m)return 0;if(id==='tackle')return 30;if(m.heal)return 70;if(!m.p)return 45;return m.p;}
function learnMove(mon,id){
  if(!MOVES[id]||mon.moves.indexOf(id)>=0)return{learned:false,forgot:null};
  if(mon.moves.length<4){mon.moves.push(id);return{learned:true,forgot:null};}
  let wi=0;for(let i=1;i<mon.moves.length;i++)if(_mvScore(mon.moves[i])<_mvScore(mon.moves[wi]))wi=i;
  if(_mvScore(id)>_mvScore(mon.moves[wi])){const f=mon.moves[wi];mon.moves[wi]=id;return{learned:true,forgot:f};}
  return{learned:false,forgot:null};
}
function expFor(l){return Math.floor(0.8*l*l*l);}
function stats(mon){
  const s=SPECIES[mon.sp],b=s?s.b:[40,40,40,40],lv=mon.lv,mu=mon.mul||{};
  const st={hp:Math.floor(b[0]*lv/50)+lv+10,atk:Math.floor(b[1]*lv/50)+5,def:Math.floor(b[2]*lv/50)+5,spd:Math.floor(b[3]*lv/50)+5,ep:12+lv};
  if(mu.hp)st.hp=Math.max(1,Math.floor(st.hp*mu.hp));
  if(mu.atk)st.atk=Math.max(1,Math.floor(st.atk*mu.atk));
  if(mu.def)st.def=Math.max(1,Math.floor(st.def*mu.def));
  return st;
}
function createMon(id,lv,mul){
  lv=clamp(lv|0,1,100);
  const mon={sp:id,lv,exp:expFor(lv),hp:1,ep:1,moves:[],st:null};
  if(mul)mon.mul=mul;
  for(const[l,m]of learnset(id)){if(l<=lv)learnMove(mon,m);}
  const s=stats(mon);mon.hp=s.hp;mon.ep=s.ep;
  return mon;
}
function monName(mon){if(!mon)return'';if(mon.nick)return mon.nick;const s=SPECIES[mon.sp];return s?s.name:String(mon.sp);}
function healMon(mon){const s=stats(mon);mon.hp=s.hp;mon.ep=s.ep;mon.st=null;}

function drawShrine(c,px,py,time){

      for(let wy=top+8;wy<HZ-6;wy+=12){fg.fillStyle=r()<0.6?'#ffd070':'#3a3050';fg.fillRect(x-1,wy,2,3);fg.fillStyle=col;}};
    fg.fillStyle=col;fg.fillRect(120,62,240,HZ-60);
    for(let x=120;x<360;x+=8)fg.fillRect(x,58,5,4);
    for(const[x,w,t]of[[130,8,40],[180,6,48],[240,12,18],[300,6,46],[350,8,36],[60,5,60],[420,5,58]])spire(x,w,t);
    break;}
  default:_gxRidge(fg,80,8,0.015,1,far,HZ+2);
  }
  // ground band
  const gTop=HZ;
  const gc=key==='meadow'||key==='forest'?th.grass||th.floor:th.floor;
  _gxGrad(fg,gTop,H,shade(gc,-0.12),shade(gc,0.05));
  for(let y=gTop+3,step=3;y<H;y+=step,step+=1){fg.fillStyle=_gxRgba(shade(gc,-0.25),0.35);fg.fillRect(0,y,W,1);}
  for(let i=0;i<80;i++){const y=ri(gTop+4,H-2,r),x=ri(0,W,r);fg.fillStyle=_gxRgba(r()<0.5?shade(gc,0.25):shade(gc,-0.25),0.7);fg.fillRect(x,y,2,1);}
  if(key==='coast'||key==='mire'){fg.fillStyle=_gxRgba(shade(gc,0.3),0.5);fg.fillRect(0,gTop,W,1);}
  // platforms
  const top=key==='meadow'||key==='forest'?shade(th.grass||th.floor,0.2):key==='sky'?'#f0f0ff':shade(th.floor,0.2);
  _gxPlatform(fg,340,118,72,14,top);
  _gxPlatform(fg,120,206,86,16,top);
  return{back,front};
}

// ======== mapgen.js ========
// ===================== MAPGEN =====================
const MG_OUTDOOR={meadow:1,forest:1,coast:1,desert:1,snow:1,sky:1};

function tileAt(map,x,y){if(x<0||y<0||x>=map.w||y>=map.h)return T_WALL;return map.tiles[y*map.w+x];}
function setTile(map,x,y,v){if(x<0||y<0||x>=map.w||y>=map.h)return;map.tiles[y*map.w+x]=v;}

function _mgBFS(tiles,w,h,sx,sy,blk){
  const d=new Int32Array(w*h).fill(-1);const q=new Int32Array(w*h);let qh=0,qt=0;
  d[sy*w+sx]=0;q[qt++]=sy*w+sx;
  while(qh<qt){const c=q[qh++],cx=c%w,cy=(c/w)|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;
      const n=ny*w+nx;if(d[n]>=0||!passable(tiles[n])||(blk&&blk[n]))continue;d[n]=d[c]+1;q[qt++]=n;}}
  return d;
}

function _mgLoot(li,r){
  if(r()<0.38)return{gold:ri(20,60,r)*(li+1)};
  const pool=[['potion',0],['orb',0],['cure',0],['super',2],['ether',1],['gorb',3],['revive',4],['max',6],['uorb',7]];
  let ids=pool.filter(p=>li>=p[1]).map(p=>p[0]);
  if(typeof ITEMS!=='undefined'&&ITEMS){const f=ids.filter(id=>ITEMS[id]);if(f.length)ids=f;}
  // later levels: prefer stronger items
  const id=(li>=3&&r()<0.5)?ids[ids.length-1-ri(0,Math.min(2,ids.length-1),r)]:pick(ids,r);
  const n=/orb/.test(id)?ri(2,3,r):(id==='potion'||id==='super'?ri(1,3,r):1);
  return{item:id,n};
}

function genLevel(li){
  const seed=1000+li*7919;const r=RNG(seed);
  const lv=(typeof LEVELS!=='undefined'&&LEVELS[li])||{size:[40,30],theme:'meadow'};
  const w=lv.size[0],h=lv.size[1];const theme=lv.theme;const outdoor=!!MG_OUTDOOR[theme];
  const tiles=new Uint8Array(w*h).fill(T_WALL);
  const I=(x,y)=>y*w+x;
  const inner=(x,y)=>x>=1&&y>=1&&x<w-1&&y<h-1;
  const map={w,h,tiles,rooms:[],start:{x:0,y:0},boss:{x:0,y:0},shrines:[],chests:[],npcs:[],seed,li,theme};

  // ---- rooms
  const want=7+li;const rooms=[];
  for(let a=0;a<1500&&rooms.length<want;a++){
    const rw=ri(5,10,r),rh=ri(4,8,r);if(rw+4>w||rh+4>h)continue;
    const x=ri(2,w-rw-2,r),y=ri(2,h-rh-2,r);
    let ok=true;for(const o of rooms){if(x<o.x+o.w+2&&x+rw+2>o.x&&y<o.y+o.h+2&&y+rh+2>o.y){ok=false;break;}}
    if(ok)rooms.push({x,y,w:rw,h:rh,cx:x+(rw>>1),cy:y+(rh>>1)});
  }
  rooms.sort((a,b)=>(a.cx+a.cy*0.25)-(b.cx+b.cy*0.25));
  map.rooms=rooms;
  for(const o of rooms)for(let y=o.y;y<o.y+o.h;y++)for(let x=o.x;x<o.x+o.w;x++)tiles[I(x,y)]=T_FLOOR;

  // ---- corridors
  const ct=outdoor?T_PATH:T_FLOOR;
  const carve=(x,y)=>{if(inner(x,y)&&tiles[I(x,y)]===T_WALL)tiles[I(x,y)]=ct;};
  const corridor=(a,b)=>{
    const wd=outdoor?2:(r()<0.5?1:2);const hf=r()<0.5;
    const hseg=(x0,x1,y)=>{for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++){carve(x,y);if(wd>1)carve(x,y+1);}};
    const vseg=(y0,y1,x)=>{for(let y=Math.min(y0,y1);y<=Math.max(y0,y1)+(wd>1?1:0);y++){carve(x,y);if(wd>1)carve(x+1,y);}};
    if(hf){hseg(a.cx,b.cx,a.cy);vseg(a.cy,b.cy,b.cx);}else{vseg(a.cy,b.cy,a.cx);hseg(a.cx,b.cx,b.cy);}
  };
  for(let i=0;i+1<rooms.length;i++)corridor(rooms[i],rooms[i+1]);
  const loops=ri(2,3,r);
  for(let k=0,tries=0;k<loops&&tries<50&&rooms.length>3;tries++){
    const i=ri(0,rooms.length-1,r),j=ri(0,rooms.length-1,r);if(Math.abs(i-j)<2)continue;corridor(rooms[i],rooms[j]);k++;
  }

  // ---- organic erosion (outdoor)
  if(outdoor){const snap=tiles.slice();
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){if(snap[I(x,y)]!==T_WALL)continue;
      if((snap[I(x+1,y)]===T_FLOOR||snap[I(x-1,y)]===T_FLOOR||snap[I(x,y+1)]===T_FLOOR||snap[I(x,y-1)]===T_FLOOR)&&r()<0.25)tiles[I(x,y)]=T_FLOOR;}
  }
  for(let x=0;x<w;x++){tiles[I(x,0)]=T_WALL;tiles[I(x,h-1)]=T_WALL;}
  for(let y=0;y<h;y++){tiles[I(0,y)]=T_WALL;tiles[I(w-1,y)]=T_WALL;}

  // ---- start, distance, boss
  const r0=rooms[0];map.start={x:r0.cx,y:r0.cy};tiles[I(r0.cx,r0.cy)]=T_FLOOR;
  let dist=_mgBFS(tiles,w,h,r0.cx,r0.cy);
  for(let i=0;i<w*h;i++)if(dist[i]<0&&passable(tiles[i]))tiles[i]=T_WALL; // safety: no isolated pockets
  const rd=o=>dist[I(o.cx,o.cy)];
  let bossRoom=rooms[0];for(const o of rooms)if(rd(o)>rd(bossRoom))bossRoom=o;
  map.boss={x:bossRoom.cx,y:bossRoom.cy};
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(inner(bossRoom.cx+dx,bossRoom.cy+dy))tiles[I(bossRoom.cx+dx,bossRoom.cy+dy)]=T_FLOOR;
  dist=_mgBFS(tiles,w,h,r0.cx,r0.cy);
  const byDist=rooms.slice().sort((a,b)=>rd(a)-rd(b));
  const near=(x,y,p,rad)=>Math.abs(x-p.x)<=rad&&Math.abs(y-p.y)<=rad;
  const reservedG=(x,y)=>near(x,y,map.start,2)||near(x,y,map.boss,2);

  // ---- grass
  const grassProb=Math.min(0.85,0.55+li*0.03);
  const blob=(cx,cy,rx,ry,okT)=>{for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
    if(!inner(x,y)||reservedG(x,y))continue;const ex=(x-cx)/rx,ey=(y-cy)/ry;if(ex*ex+ey*ey>1+r()*0.3)continue;
    if(okT(tiles[I(x,y)]))tiles[I(x,y)]=T_GRASS;}};
  for(const o of rooms){if(o===r0||o===bossRoom||r()>grassProb)continue;
    const n=ri(1,2+Math.floor(li/3),r);
    for(let k=0;k<n;k++)blob(o.x+r()*o.w,o.y+r()*o.h,1.5+r()*2.5,1.2+r()*2,t0=>t0===T_FLOOR);}
  const cg=0.012+li*0.003;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    if(tiles[I(x,y)]!==ct)continue;if(rooms.some(o=>x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h))continue;
    if(r()<cg)blob(x,y,1+r()*1.5,1+r()*1.5,t0=>t0===T_FLOOR||t0===T_PATH);}

  // ---- blocker placement (never cuts paths: full passable 8-ring, ring stays passable)
  const blk=new Uint8Array(w*h); // npcs / blockers
  const isFree=(x,y)=>inner(x,y)&&passable(tiles[I(x,y)])&&!blk[I(x,y)];
  const canBlock=(x,y)=>{if(!inner(x,y))return false;const t0=tiles[I(x,y)];if((t0!==T_FLOOR&&t0!==T_PATH)||blk[I(x,y)])return false;
    if(near(x,y,map.start,1)||near(x,y,map.boss,2))return false;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;if(!isFree(x+dx,y+dy))return false;}
    return true;};
  const roomCells=o=>{const c=[];for(let y=o.y-1;y<=o.y+o.h;y++)for(let x=o.x-1;x<=o.x+o.w;x++)if(canBlock(x,y))c.push([x,y]);return c;};
  // pick spot in room, optionally nearest to (px,py) with jitter; fallback to any cell with similar distance
  const spotIn=(o,px,py,minD)=>{let c=roomCells(o);
    if(px!=null){c=c.filter(([x,y])=>Math.max(Math.abs(x-px),Math.abs(y-py))>=(minD||0));
      c.sort((a,b)=>(Math.hypot(a[0]-px,a[1]-py)+r()*1.5)-(Math.hypot(b[0]-px,b[1]-py)+r()*1.5));
      if(c.length)return c[0];}
    else if(c.length)return c[Math.floor(r()*c.length)];
    const tgt=rd(o);let best=null,bd=1e9;
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){if(!canBlock(x,y))continue;const s=Math.abs(dist[I(x,y)]-tgt)+r()*3;if(s<bd){bd=s;best=[x,y];}}
    return best;};
  const faceDir=(x,y)=>{let bd='down',bv=1e9;for(const k of['down','left','right','up']){const[dx,dy]=DIRS[k];const n=I(x+dx,y+dy);
    if(dist[n]>=0&&dist[n]<bv&&passable(tiles[n])){bv=dist[n];bd=k;}}return bd;};
  const shrine=s=>{if(!s)return;tiles[I(s[0],s[1])]=T_SHRINE;map.shrines.push({x:s[0],y:s[1]});};
  const npc=(s,kind,idx,dir)=>{if(!s)return;blk[I(s[0],s[1])]=1;map.npcs.push({x:s[0],y:s[1],kind,idx,pal:ri(1,8,r),dir:dir||faceDir(s[0],s[1])});};
  const rank=f=>byDist[clamp(Math.round(f*(byDist.length-1)),1,Math.max(1,byDist.length-2))]||byDist[0];

  shrine(spotIn(r0,r0.cx+ri(-2,2,r),r0.cy-2,2));
  npc(spotIn(r0,r0.cx+2,r0.cy+1,2),'hint',0);
  const shopRoom=byDist[1]||r0;npc(spotIn(shopRoom,shopRoom.cx,shopRoom.cy,0),'shop',0,'down');
  shrine(spotIn(rank(0.5),rank(0.5).cx,rank(0.5).cy,0));
  if(li>=4&&byDist.length>2){const pb=byDist[byDist.length-2];shrine(spotIn(pb,pb.cx,pb.cy,0));}
  npc(spotIn(rank(0.4),rank(0.4).cx,rank(0.4).cy,0),'trainer',0);
  npc(spotIn(rank(0.75),rank(0.75).cx,rank(0.75).cy,0),'trainer',1);
  const others=rooms.filter(o=>o!==r0&&o!==bossRoom);
  for(let k=0;k<3;k++){const o=others.length?pick(others,r):r0;const s=spotIn(o);npc(s,'lore',k,s?pick(['down','left','right','up'],r):null);}
  const nCh=3+Math.floor(li/2);const cr=rooms.filter(o=>o!==r0);
  for(let k=0;k<nCh;k++){const o=cr[(k*3+ri(0,cr.length-1,r))%cr.length]||r0;const s=spotIn(o);if(!s)continue;
    tiles[I(s[0],s[1])]=T_CHEST;map.chests.push({x:s[0],y:s[1],loot:_mgLoot(li,r)});}

  // ---- obstacles and decorations
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){if(tiles[I(x,y)]===T_FLOOR&&r()<0.03&&canBlock(x,y))tiles[I(x,y)]=T_BLOCK;}
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=I(x,y);
    if(tiles[i]===T_FLOOR&&!blk[i]&&!near(x,y,map.start,0)&&!near(x,y,map.boss,1)&&r()<0.07)tiles[i]=T_DECO;}
  return map;
}

const AU_RH=[

  [[4,4,4,4],[6,2,4,4],[4,2,2,8],[8,4,4],[4,4,8],[2,2,4,8],[6,2,6,2]],
  [[2,2,2,2,4,4],[4,2,2,4,2,2],[2,2,4,2,2,4],[3,3,2,4,4],[4,2,2,2,2,4],[3,3,2,2,2,4]]];
const AU_CAD=[[8,8],[4,12],[6,2,8],[4,4,8],[2,2,4,8]];
const AU_DRUMS={
  none:{},
  light:{k:'x.......x.......',h:'..o...o...o...o.'},
  sparse:{k:'x...............',s2:'........o.......',h:'......o.........'},
  basic:{k:'x.......x.x.....',s:'....x.......x...',h:'o.o.o.o.o.o.o.o.',fill:'....x.......x.xx'},
  drive:{k:'x...x...x...x.x.',s:'....x.......x...',h:'oxoxoxoxoxoxoxox',fill:'....x...x.x.xxxx'},
  tribal:{k:'x..x..x...x..x..',t:'....x..x.x....x.',h:'o.o.o.o.o.o.o.o.',fill:'x.x.x.xxx.x.xxxx'},
  march:{k:'x...x...x...x...',s:'....x..o....x.oo',h:'o.......o.......',fill:'x.x.x.x.xxxxxxxx'}};

function auParseHand(str,bar0){const out=[];let s=bar0*16;
  for(const tk of str.trim().split(/\s+/)){const[a,b]=tk.split(':');const len=+b;out.push({s,len,deg:a==='r'?null:+a});s+=len;}return out;}

function auMelody(d,r,chordAt){
  const dens=d.density==null?.6:d.density;
  const tier=()=>{const x=dens+(r()-.5)*.3;return x<.42?0:x<.72?1:2;};
  const pickR=()=>pick(AU_RH[tier()],r);
  const lo=d.lo==null?-2:d.lo,hi=d.hi==null?10:d.hi;
  const isCT=(g,c)=>{const x=((g-c)%7+7)%7;return x===0||x===2||x===4;};
  const snap=(g,c)=>{if(isCT(g,c))return g;for(let k=1;k<4;k++){const a=isCT(g+k,c),b=isCT(g-k,c);
    if(a&&b)return r()<.5?g+k:g-k;if(a)return g+k;if(b)return g-k;}return g;};
  const fold=g=>{if(g<lo)g=lo+(lo-g);if(g>hi)g=hi-(g-hi);return clamp(g,lo,hi);};
  let prev=d.start==null?4:d.start;
  const lastDeg=arr=>{for(let i=arr.length-1;i>=0;i--)if(arr[i].deg!=null)return arr[i].deg;return prev;};
  function bar(b,rh,target,mode){let s=0;const out=[];
    rh.forEach((len,k)=>{const last=k===rh.length-1,c=chordAt(b,s);let g;
      if(mode===2&&last){g=Math.abs(prev-7)<=Math.abs(prev)?7:0;}
      else if(s%8===0||(mode===1&&last)){const cand=[];let tw=0;
        for(let x=prev-4;x<=prev+4;x++){if(x<lo||x>hi||!isCT(x,c))continue;
          let w=1/(1+Math.abs(x-prev));if(x===prev)w*=.35;if((target-prev)*(x-prev)>0)w*=1.7;cand.push([x,w]);tw+=w;}
        g=prev;let q=r()*tw;for(const[x,w]of cand){q-=w;if(q<=0){g=x;break;}}if(!cand.length)g=snap(prev,c);}
      else{const mv=r()<.08?0:r()<.74?1:r()<.85?2:3;const up=target>prev?r()<.72:target<prev?r()<.28:r()<.5;g=fold(prev+(up?mv:-mv));}
      const rest=mode===0&&s%8!==0&&!last&&r()<(1-dens)*.22;
      out.push({s:b*16+s,len,deg:rest?null:g});if(!rest)prev=g;s+=len;});
    return out;}
  function refit(src,from,to,shift){const out=[];
    for(const n of src){if(Math.floor(n.s/16)!==from)continue;const st=n.s%16;let g=n.deg;
      if(g!=null){g=fold(g+(shift||0));if(st%8===0)g=snap(g,chordAt(to,st));}
      out.push({s:to*16+st,len:n.len,deg:g});}
    prev=lastDeg(out);return out;}
  if(d.hand){const A2=auParseHand(d.hand.A2,4);
    return [...auParseHand(d.hand.A,0),...A2,...auParseHand(d.hand.B,8),...auParseHand(d.hand.A2,12)];}
  let A;
  if(d.motif){A=auParseHand(d.motif,0);prev=lastDeg(A);}
  else{const r0=pickR(),r1=pickR();A=[...bar(0,r0,5,0),...bar(1,r1,6,0),...bar(2,r0,4,0),...bar(3,pick(AU_CAD,r),2,1)];}
  const Ap=[...refit(A,0,4),...refit(A,1,5)];Ap.push(...bar(6,pickR(),5,0));Ap.push(...bar(7,pick(AU_CAD,r),3,1));
  const b8=bar(8,pickR(),8,0);const B=[...b8,...bar(9,pickR(),7,0),...refit(b8,8,10,-1)];B.push(...bar(11,pick(AU_CAD,r),4,1));
  const A3=[...refit(Ap,4,12),...refit(Ap,5,13),...refit(Ap,6,14)];A3.push(...bar(15,pick(AU_CAD.slice(0,4).filter(x=>x[x.length-1]===8),r)||[8,8],0,2));
  return [...A,...Ap,...B,...A3];
}

function auGenPart(song,d,pi){
  const r=RNG((d.seed||hashStr(song.key))+pi*7919);
  const off=song.steps,BARS=16;
  const sc=AU_SCALES[d.scale]||AU_SCALES.major,prog=d.prog;
  const chordAt=(bar,st)=>{const c=prog[((bar%prog.length)+prog.length)%prog.length];return Array.isArray(c)?(st<8?c[0]:c[1]):c;};
  const scFor=c=>{if(d.majV&&((c%7)+7)%7===4&&sc[6]===10){const s=sc.slice();s[6]=11;return s;}return sc;};
  const semi=(deg,c)=>auDegSemi(scFor(c),deg);
  const add=(step,ev)=>{const s=off+step;(song.ev[s]||(song.ev[s]=[])).push(ev);};
  const echo=!!d.echo;
  // lead (+ optional harmony a diatonic third below)
  const L=Object.assign({w:'p25',v:.1,vib:0,leg:.88,att:.006,rel:.06},d.lead);
  const lb=d.root+12*(d.leadOct==null?1:d.leadOct);
  for(const n of auMelody(d,r,chordAt)){if(n.deg==null)continue;const st=n.s%16,c=chordAt(Math.floor(n.s/16),st);
    const acc=st%4===0?1:.82;
    add(n.s,{i:L.w,m:lb+semi(n.deg,c),d:n.len*L.leg,v:L.v*acc,a:L.att,r:L.rel,vib:L.vib,e:echo});
    if(d.dbl)add(n.s,{i:d.dbl,m:lb+semi(n.deg-2,c),d:n.len*L.leg,v:L.v*.45*acc,a:L.att,r:L.rel,vib:0,e:false});}
  // bass
  const bw=d.bassW||'tri',bv=d.bassV||.24;
  const bassNote=c=>{const s=((semi(c,c)%12)+12)%12;let m=d.root-12+s;if(s>7)m-=12;while(m<33)m+=12;return m;};
  const iv=(c,k)=>semi(c+k,c)-semi(c,c);
  const B=(st,len,m,v)=>add(st,{i:bw,m,d:len,v:bv*(v||1),a:.004,r:.04,vib:0,e:false});
  for(let b=0;b<BARS;b++){const o=b*16,st=d.bass||'slow';
    if(st==='slow'){const c0=chordAt(b,0),c1=chordAt(b,8);
      if(c0!==c1){B(o,7.6,bassNote(c0));B(o+8,7.6,bassNote(c1));}else B(o,15.5,bassNote(c0));}
    else if(st==='pulse'){for(let s=0;s<16;s+=2){const c=chordAt(b,s);B(o+s,1.4,bassNote(c),s%4===0?1:.7);}}
    else if(st==='drive'){const pat=[0,0,12,0,0,0,12,'5'];for(let j=0;j<8;j++){const s=j*2,c=chordAt(b,s),p=pat[j];
      B(o+s,1.5,bassNote(c)+(p==='5'?iv(c,4):p),j%2?.75:1);}}
    else if(st==='bounce'){for(const[s,k,l]of[[0,0,3],[4,12,1.5],[6,'5',1.5],[8,0,3],[12,12,1.5],[14,'5',1.5]]){
      const c=chordAt(b,s);B(o+s,l,bassNote(c)+(k==='5'?iv(c,4):k),s%8===0?1:.75);}}
    else if(st==='walk'){let pc=null;for(let j=0;j<4;j++){const s=j*4,c=chordAt(b,s),rt=bassNote(c);let m;
      if(j===0||c!==pc)m=rt;else if(j===1)m=rt+iv(c,2);else if(j===2)m=rt+iv(c,4);
      else{const nm=bassNote(chordAt(b+1,0));m=nm+(nm>rt+iv(c,4)?-1:nm===rt?7:1);}
      pc=c;B(o+s,3.2,m,j===0?1:.8);}}
  }
  // arpeggio
  if(d.arp){const stp=d.arp===1?1:2,pat=d.arpPat||[0,2,4,7,4,2],ab=d.root+12*(d.arpOct==null?1:d.arpOct);
    for(let s=0,j=0;s<BARS*16;s+=stp,j++){const c=chordAt(Math.floor(s/16),s%16);
      add(s,{i:d.arpW||'p12',m:ab+semi(c+pat[j%pat.length],c),d:stp*.7,v:(d.arpV||.025)*(s%4===0?1:.75),a:.003,r:.03,vib:0,e:echo});}}
  // pad
  if(d.pad){const offs=d.padOct||[0];
    for(let b=0;b<BARS;b++){const c0=chordAt(b,0),c1=chordAt(b,8),regs=c0===c1?[[0,16,c0]]:[[0,8,c0],[8,8,c1]];
      for(const[s,len,c]of regs)for(const k of[0,2,4])for(const oo of offs){
        let m=d.root+semi(c+k,c);if(m>d.root+14)m-=12;
        add(b*16+s,{i:d.pad,m:m+oo,d:len-.3,v:(d.padV||.03),a:d.padA||.25,r:.35,vib:0,e:false});}}}
  // bells
  if(d.bells){for(let s=0;s<BARS*16;s+=8){if(r()>.72)continue;const c=chordAt(Math.floor(s/16),s%16);
    add(s,{i:'bell',m:d.root+24+semi(c+pick([0,2,4,7],r),c),d:8,v:d.bellV||.04,a:.002,r:.3,vib:0,e:echo});}}
  // drums
  const P=AU_DRUMS[d.drum||'none']||{};
  for(let b=0;b<BARS;b++){const fill=b%8===7&&P.fill;
    for(const k of['k','s','s2','h','t']){let pat=P[k];if(k==='s'&&fill)pat=P.fill;if(k==='t'&&fill&&!P.s)pat=P.fill;
      if(!pat)continue;if(k==='s2'&&b%2===0)continue;
      for(let s=0;s<16;s++){const ch=pat[s];if(ch==='.')continue;
        add(b*16+s,{i:k==='s2'?'s':k,v:ch==='x'?1:.55});}}
    if(b===0&&(d.drum==='drive'||d.drum==='march'))add(0,{i:'c',v:.7});}
  song.steps+=BARS*16;song.bars+=BARS;
}

function auGenSong(key){
  if(AU.songs[key])return AU.songs[key];
  const base=MUSIC_DEFS[key];if(!base)return null;
  const parts=base.parts?base.parts.map(p=>Object.assign({},base,p,{parts:null})):[base];
  const song={key,bpm:base.bpm,stepDur:60/base.bpm/4,bars:0,steps:0,ev:[],swing:base.swing||0,swing8:base.swing8||0,echo:base.echo||0};
  parts.forEach((p,i)=>auGenPart(song,p,i));
  for(let i=0;i<song.steps;i++)if(!song.ev[i])song.ev[i]=[];
  AU.songs[key]=song;return song;
}

// ---------- synthesis primitives ----------
function _auPulse(c,duty){const N=48,re=new Float32Array(N+1),im=new Float32Array(N+1);
  for(let n=1;n<=N;n++){re[n]=Math.sin(2*Math.PI*n*duty)/(Math.PI*n);im[n]=(1-Math.cos(2*Math.PI*n*duty))/(Math.PI*n);}
  return c.createPeriodicWave(re,im);}
function _auSetup(c){
  AU.ctx=c;
  AU.comp=c.createDynamicsCompressor();AU.comp.threshold.value=-14;AU.comp.knee.value=12;AU.comp.ratio.value=4;
  AU.comp.attack.value=.004;AU.comp.release.value=.2;AU.comp.connect(c.destination);
  AU.master=c.createGain();AU.master.connect(AU.comp);
  for(const k of['music','sfx','jing']){AU[k]=c.createGain();AU[k].connect(AU.master);}
  const len=c.sampleRate|0,buf=c.createBuffer(1,len,c.sampleRate),dd=buf.getChannelData(0);
  for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;AU.noise=buf;
  AU.waves={p12:_auPulse(c,.125),p25:_auPulse(c,.25),p50:_auPulse(c,.5)};
}
function _auOsc(w,f,t){const c=AU.ctx,o=c.createOscillator();
  if(w==='tri')o.type='triangle';else if(w==='sine')o.type='sine';else if(w==='saw')o.type='sawtooth';
  else o.setPeriodicWave(AU.waves[w]||AU.waves.p50);
  o.frequency.setValueAtTime(f,t);return o;}
function _auVoice(dst,send,w,f,t,dur,v,a,rel,vib){
  const c=AU.ctx;
  if(w==='bell'){const g=c.createGain(),o=_auOsc('tri',f,t),g2=c.createGain(),o2=_auOsc('sine',f*2,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.003);g.gain.setTargetAtTime(0,t+.003,.4);
    g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(v*.4,t+.002);g2.gain.setTargetAtTime(0,t+.002,.12);
    o.connect(g);o2.connect(g2);g.connect(dst);g2.connect(dst);if(send){g.connect(send);}
    o.start(t);o2.start(t);o.stop(t+2.2);o2.stop(t+.8);return;}
  const o=_auOsc(w,f,t),g=c.createGain();a=Math.max(.002,a||.005);rel=Math.max(.02,rel||.05);
  const end=t+Math.max(dur,a+.01);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setTargetAtTime(v*.72,t+a,Math.max(.04,dur*.4));
  g.gain.setTargetAtTime(0,end,rel/3);
  if(vib&&dur>.22){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.2;
    lg.gain.setValueAtTime(0,t);lg.gain.setValueAtTime(0,t+.14);lg.gain.linearRampToValueAtTime(f*.011*vib,t+.38);
    l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(end+rel+.05);}
  o.connect(g);g.connect(dst);if(send)g.connect(send);
  o.start(t);o.stop(end+rel+.05);
}
function _auNoise(dst,t,dur,v,type,freq,q,f1){const c=AU.ctx,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.noise;fl.type=type||'lowpass';fl.frequency.setValueAtTime(freq||2000,t);if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
  fl.Q.value=q||.7;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  s.connect(fl);fl.connect(g);g.connect(dst);s.start(t,Math.random()*.5);s.stop(t+dur+.02);}
function _auSweep(dst,w,f0,f1,t,dur,v,att){const c=AU.ctx,o=_auOsc(w,f0,t),g=c.createGain();
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);att=att||.004;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  o.connect(g);g.connect(dst);o.start(t);o.stop(t+dur+.02);}
function _auDrum(dst,k,t,v){
  if(k==='k'){_auSweep(dst,'sine',160,42,t,.2,.42*v,.002);_auSweep(dst,'tri',90,40,t,.08,.18*v,.002);}
  else if(k==='s'){_auNoise(dst,t,.13,.16*v,'bandpass',1900,.8);_auSweep(dst,'tri',200,130,t,.07,.13*v);}
  else if(k==='h'){_auNoise(dst,t,.035,.05*v,'highpass',7000,.7);}
  else if(k==='t'){_auSweep(dst,'tri',140,72,t,.18,.26*v,.002);_auNoise(dst,t,.05,.05*v,'lowpass',1400,.7);}
  else if(k==='c'){_auNoise(dst,t,.9,.06*v,'highpass',5000,.5);}
}

// ---------- music tracks ----------
function _auCustomUrl(key){if(!SET.customMusic||!AU.custom)return null;const f=AU.custom[key];if(!f||typeof f!=='string')return null;
  return /^(https?:|\/|music\/|\.)/.test(f)?f:'music/'+f;}
function _auMusicVol(){return Math.pow(clamp(SET.master,0,100)/100,1.6)*Math.pow(clamp(SET.music,0,100)/100,1.6);}
function _auMakeSynth(key){
  const c=AU.ctx,song=auGenSong(key);if(!song)return null;
  const tr={key,song,html:null,paused:false,step:0,nextT:c.currentTime+.08,out:c.createGain(),send:null,nodes:[]};
  tr.out.gain.setValueAtTime(0,c.currentTime);tr.out.gain.linearRampToValueAtTime(1,c.currentTime+.25);tr.out.connect(AU.music);
  if(song.echo){const s=c.createGain(),dl=c.createDelay(1.5),fb=c.createGain(),lp=c.createBiquadFilter(),wet=c.createGain();
    dl.delayTime.value=Math.min(1.2,song.stepDur*3);fb.gain.value=.28+song.echo*.25;lp.type='lowpass';lp.frequency.value=2600;
    wet.gain.value=song.echo*.55;s.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(tr.out);
    tr.send=s;tr.nodes=[s,dl,fb,lp,wet];}
  return tr;
}
function _auStep(tr,step,t){
  const song=tr.song,sd=song.stepDur;
  if(step%2===1)t+=song.swing*sd;if(step%4===2)t+=song.swing8*sd*2;
  for(const e of song.ev[step]){
    if(e.m==null)_auDrum(tr.out,e.i,t,e.v);
    else _auVoice(tr.out,e.e?tr.send:null,e.i,mtof(e.m),t,e.d*sd,e.v,e.a,e.r,e.vib);}
}
function _auTick(){
  const c=AU.ctx,tr=AU.cur;if(!c||!tr||tr.paused||tr.html||c.state!=='running')return;
  const sd=tr.song.stepDur,now=c.currentTime;
  if(tr.nextT<now-.05){const n=Math.ceil((now+.03-tr.nextT)/sd);tr.step=(tr.step+n)%tr.song.steps;tr.nextT+=n*sd;}
  let guard=0;

function applyAudio(){
  const c=AU.ctx;if(!c)return;
  const pw=x=>Math.pow(clamp(+x||0,0,100)/100,1.6),t=c.currentTime;
  AU.master.gain.setTargetAtTime(pw(SET.master),t,.03);
  AU.music.gain.setTargetAtTime(pw(SET.music)*.9,t,.03);
  AU.jing.gain.setTargetAtTime(Math.max(pw(SET.music),pw(SET.sfx)*.6),t,.03);
  AU.sfx.gain.setTargetAtTime(pw(SET.sfx)*.9,t,.03);
  const hide=typeof document!=='undefined'&&document.hidden&&SET.bgMute;
  if(hide&&c.state==='running')c.suspend().catch(()=>{});
  else if(!hide&&c.state==='suspended')c.resume().catch(()=>{});
  const tr=AU.cur;
  if(tr&&!tr.dead){
    const wantUrl=_auCustomUrl(tr.key);
    if(!!wantUrl!==!!tr.html&&!AU.jingle){_auStart(tr.key);return;}
    if(tr.html){try{tr.html.volume=clamp(_auMusicVol(),0,1);if(hide)tr.html.pause();else if(!tr.paused)tr.html.play().catch(()=>{});}catch(e){}}
  }
}
function audioInit(){
  if(typeof window==='undefined')return;
  if(AU.ctx){if(AU.ctx.state==='suspended'&&!(document.hidden&&SET.bgMute))AU.ctx.resume().catch(()=>{});return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC({latencyHint:'interactive'});}catch(e){try{c=new AC();}catch(e2){return;}}
  try{_auSetup(c);}catch(e){AU.ctx=null;return;}
  if(c.state==='suspended')c.resume().catch(()=>{});
  AU.timer=setInterval(_auTick,25);
  applyAudio();
  try{fetch('music/tracks.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||typeof j!=='object')return;AU.custom=j;
    if(AU.cur&&!AU.cur.html&&!AU.jingle&&_auCustomUrl(AU.cur.key))_auStart(AU.cur.key);}).catch(()=>{});}catch(e){}
  if(AU.want&&!AU.cur)_auStart(AU.want);
}

  const g=()=>audioInit();
  for(const ev of['pointerdown','keydown','touchend','mousedown'])window.addEventListener(ev,g,{capture:true,passive:true});

}

  opt=opt||{};x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
  const dk=!!opt.dark,r=opt.r==null?5:opt.r;
  ctx.save();if(opt.alpha!=null)ctx.globalAlpha*=opt.alpha;
  ctx.fillStyle='rgba(0,0,0,0.25)';rr(x+1,y+2,w,h,r);ctx.fill();               // drop shadow
  if(dk){ // JRPG navy translucent window, silver-blue border
    const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'rgba(16,32,80,0.93)');g.addColorStop(1,'rgba(6,12,36,0.95)');
    ctx.fillStyle=opt.fill||g;rr(x,y,w,h,r);ctx.fill();
    ctx.strokeStyle=opt.border||'rgba(188,212,255,0.6)';ctx.lineWidth=1;rr(x+0.5,y+0.5,w-1,h-1,r);ctx.stroke();
    ctx.strokeStyle='rgba(188,212,255,0.18)';rr(x+2.5,y+2.5,w-5,h-5,Math.max(0,r-2));ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(x+3,y+3,w-6,Math.min(8,h/3));
    ctx.restore();return;
  }
  ctx.fillStyle=opt.border||UI_COL.navy;rr(x,y,w,h,r);ctx.fill();  // outer border
  ctx.fillStyle=opt.line||UI_COL.blue;rr(x+2,y+2,w-4,h-4,r-1);ctx.fill(); // light inner line
  ctx.fillStyle=opt.fill||UI_COL.cream;rr(x+3,y+3,w-6,h-6,r-2);ctx.fill();
  if(!opt.fill){ctx.fillStyle='#eeeee4';ctx.fillRect(x+4,y+h-6,w-8,2);}      // soft bottom tint
  ctx.restore();
}
function wrap(s,maxW){
  ctx.save();ctx.font=FONT;const out=[];
  for(const para of String(s==null?'':s).split('\n')){
    const words=para.split(' ');let line='';
    for(let wd of words){
      const test=line?line+' '+wd:wd;
      if(ctx.measureText(test).width<=maxW){line=test;continue;}
      if(line)out.push(line);
      // hard-break overlong words
      while(ctx.measureText(wd).width>maxW&&wd.length>1){let k=wd.length;while(k>1&&ctx.measureText(wd.slice(0,k)).width>maxW)k--;out.push(wd.slice(0,k));wd=wd.slice(k);}
      line=wd;
    }
    out.push(line);
  }
  ctx.restore();return out;
}
function textW(s,font){ctx.save();ctx.font=font||FONT;const w=ctx.measureText(String(s)).width;ctx.restore();return w;}
function hpBar(x,y,w,h,ratio){
  ratio=clamp(ratio||0,0,1);h=h||4;
  ctx.save();
  ctx.fillStyle='#283030';rr(x-1,y-1,w+2,h+2,2);ctx.fill();
  ctx.fillStyle='#506060';ctx.fillRect(x,y,w,h);
  const c=ratio>0.5?'#58d080':ratio>0.2?'#f8c030':'#f05040';
  const fw=Math.round(w*ratio);
  if(fw>0){ctx.fillStyle=c;ctx.fillRect(x,y,fw,h);ctx.fillStyle=shade(c,0.45);ctx.fillRect(x,y,fw,Math.max(1,Math.floor(h/3)));
    ctx.fillStyle=shade(c,-0.25);ctx.fillRect(x,y+h-1,fw,1);}
  ctx.restore();
}
function typeBadge(type,x,y){
  const name=(typeof TYPE_N!=='undefined'&&TYPE_N[type])?L2(TYPE_N[type]):String(type||'?');
  const col=(typeof TYPE_COL!=='undefined'&&TYPE_COL[type])||'#888888';
  const lab=name.toUpperCase();const w=Math.ceil(textW(lab))+10,h=12;
  ctx.save();
  ctx.fillStyle=shade(col,-0.5);rr(x,y,w,h,5);ctx.fill();
  ctx.fillStyle=col;rr(x+1,y+1,w-2,h-2,4);ctx.fill();
  ctx.fillStyle=shade(col,0.3);ctx.fillRect(x+4,y+2,w-8,1);
  ctx.restore();
  txt(lab,x+w/2,y+2,'#ffffff','center',FONT,shade(col,-0.55));
  return w;
}
function drawMonMini(spId,x,y,size){
  size=size||24;if(typeof monSprite!=='function')return;let c;try{c=monSprite(spId);}catch(e){return;}if(!c)return;
  ctx.save();ctx.imageSmoothingEnabled=false;
  const s=Math.max(c.width,c.height);let k=size/s;if(k>=1)k=Math.floor(k);
  const dw=c.width*k,dh=c.height*k;ctx.drawImage(c,Math.round(x+(size-dw)/2),Math.round(y+(size-dh)/2),dw,dh);
  ctx.restore();
}
function _cursor(x,y,col){
  if(typeof drawCursorTri==='function'){drawCursorTri(ctx,x,y,col||UI_COL.text);return;}
  ctx.save();ctx.fillStyle=col||UI_COL.text;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+5,y+3.5);ctx.lineTo(x,y+7);ctx.closePath();ctx.fill();ctx.restore();
}
function _arrow(x,y,up,col){ctx.save();ctx.fillStyle=col||UI_COL.text;ctx.beginPath();
  if(up){ctx.moveTo(x-4,y+4);ctx.lineTo(x+4,y+4);ctx.lineTo(x,y);}else{ctx.moveTo(x-4,y);ctx.lineTo(x+4,y);ctx.lineTo(x,y+4);}
  ctx.closePath();ctx.fill();ctx.restore();}
function _inside(ev,x,y,w,h){return ev.x>=x&&ev.x<x+w&&ev.y>=y&&ev.y<y+h;}

// ---------- widget stack ----------
function pushWidget(w){return new Promise(res=>{w._res=res;ui.push(w);});}
function closeWidget(w,value){const i=ui.indexOf(w);if(i>=0)ui.splice(i,1);if(w.onClose)try{w.onClose(value);}catch(e){console.error(e);}
  if(w._res){const r=w._res;w._res=null;r(value);}}
function closeAllWidgets(){while(ui.length)closeWidget(ui[ui.length-1],-1);}

// ---------- message box ----------
const MSG={x:4,y:H-62,w:W-8,h:58};
function _drawMsgBox(lines,chars,done,opt){
  opt=opt||{};const b=opt.box||MSG;panel(b.x,b.y,b.w,b.h,opt);
  const col=opt.dark?UI_COL.dtext:UI_COL.text,sh=opt.dark?UI_COL.dshadow:UI_COL.shadow;
  let left=chars==null?1e9:chars;
  for(let i=0;i<lines.length;i++){
    const s=lines[i];if(left<=0)break;const part=s.slice(0,left);left-=s.length;
    txt(part,b.x+12,b.y+10+i*UI_LH,col,'left',FONT,sh);
  }
  if(done&&opt.arrow!==false&&(now()*2.5|0)%2===0){
    ctx.save();ctx.fillStyle='#e05038';const ax=b.x+b.w-16,ay=b.y+b.h-14;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+8,ay);ctx.lineTo(ax+4,ay+5);ctx.closePath();ctx.fill();ctx.restore();
  }
}
function say(text,o){
  o=o||{};
  const lines=wrap(text,MSG.w-28),pages=[];
  for(let i=0;i<lines.length;i+=3)pages.push(lines.slice(i,i+3));
  if(!pages.length)pages.push(['']);
  const w={pg:0,c:0,done:false,wait:0,snd:0,
    pageLen(){return pages[this.pg].reduce((a,s)=>a+s.length,0);},
    update(dt){
      if(this!==ui[ui.length-1]&&!o.bg)return;
      if(!this.done){
        const sp=[30,60,120,1e9][clamp(SET.textSpeed|0,0,3)];
        const prev=this.c|0;this.c+=sp*dt;const L=this.pageLen();
        if(this.c>=L){this.c=L;this.done=true;this.wait=0;}
        const cur=this.c|0;if(sp<1e8&&cur>prev){this.snd+=cur-prev;if(this.snd>=4){this.snd=0;_usfx('text');}}
      }else if(o.auto&&SET.autoText){this.wait+=dt;if(this.wait>=0.8)this.advance(true);}
    },
    advance(silent){
      if(!this.done){this.c=this.pageLen();this.done=true;this.wait=0;return;}
      if(this.pg<pages.length-1){this.pg++;this.c=0;this.done=false;this.wait=0;if(!silent)_usfx('ok');return;}
      closeWidget(this,true);
    },
    draw(){_drawMsgBox(pages[this.pg],this.c|0,this.done,o);},
    input(a,rep){if(rep)return;if(a==='ok'||a==='back')this.advance();},
    mouse(ev){if(ev.type==='click'||ev.type==='dblclick'){this.advance();return true;}if(ev.type==='down'||ev.type==='context')return true;return false;}
  };
  return pushWidget(w);
}

// ---------- menu ----------
function _norm(it){return typeof it==='object'&&it!==null?it:{label:String(it)};}
function menu(o){
  o=Object.assign({cols:1,rowH:14,idx:0,cancel:true},o||{});
  const cols=Math.max(1,o.cols|0);
  const titleH=o.title?16:0;
  const items=()=>(o.items||[]).map(_norm);
  // geometry
  let its=items();
  const nRowsAll=Math.max(1,Math.ceil(its.length/cols));
  let maxRows=o.maxRows||(o.h?Math.max(1,Math.floor((o.h-12-titleH)/o.rowH)):Math.min(nRowsAll,Math.floor((H-30-titleH)/o.rowH)));
  let w=o.w;
  if(!w){let mw=0;for(const it of its){const lw=textW(L2(it.label))+(it.r!=null?textW(L2(it.r))+16:0);if(lw>mw)mw=lw;}
    if(o.title)mw=Math.max(mw,textW(L2(o.title)));w=Math.min(W-8,Math.ceil(mw*cols+(cols-1)*12+30));}
  const h=o.h||(maxRows*o.rowH+12+titleH+(nRowsAll>maxRows?6:0));
  const x=o.x!=null?o.x:W-w-4;
  const y=o.y!=null?o.y:(o.prompt?H-h-4:H-h-4);
  const cellW=(w-20)/cols;
  const m={o,idx:clamp(o.idx|0,0,Math.max(0,its.length-1)),top:0,dragAcc:0,x,y,w,h,
    get items(){return items();},
    ensure(){const n=items().length;this.idx=clamp(this.idx,0,Math.max(0,n-1));const r=Math.floor(this.idx/cols);
      if(r<this.top)this.top=r;if(r>=this.top+maxRows)this.top=r-maxRows+1;
      const nr=Math.ceil(n/cols);this.top=clamp(this.top,0,Math.max(0,nr-maxRows));},
    setIdx(i,snd){const n=items().length;if(!n)return;i=clamp(i,0,n-1);if(i===this.idx)return;this.idx=i;this.ensure();
      if(snd!==false)_usfx('move');if(o.onMove)o.onMove(i);},
    choose(){const it=items()[this.idx];if(!it)return;if(it.disabled){_usfx('deny');return;}_usfx('ok');closeWidget(this,this.idx);},
    cancelMenu(){if(!o.cancel)return;_usfx('back');closeWidget(this,-1);},
    input(a,rep){
      const n=items().length;if(!n){if(a==='back')this.cancelMenu();return;}
      const r=Math.floor(this.idx/cols),c=this.idx%cols,nr=Math.ceil(n/cols);
      if(a==='up'){if(r>0)this.setIdx(this.idx-cols);else if(cols===1&&!rep&&n>1)this.setIdx(n-1);}
      else if(a==='down'){if(this.idx+cols<n)this.setIdx(this.idx+cols);else if(cols>1&&r<nr-1)this.setIdx(n-1);else if(cols===1&&!rep&&n>1)this.setIdx(0);}
      else if(a==='left'){if(cols>1){if(c>0)this.setIdx(this.idx-1);}else if(maxRows<n)this.setIdx(this.idx-maxRows);}
      else if(a==='right'){if(cols>1){if(c<cols-1&&this.idx+1<n)this.setIdx(this.idx+1);}else if(maxRows<n)this.setIdx(this.idx+maxRows);}
      else if(a==='ok'&&!rep)this.choose();
      else if(a==='back'&&!rep)this.cancelMenu();
    },
    hit(ev){const its=items();const oy=this.y+6+titleH,ox=this.x+10;
      if(!_inside(ev,ox,oy,this.w-20,maxRows*o.rowH))return -1;
      const r=Math.floor((ev.y-oy)/o.rowH)+this.top,c=clamp(Math.floor((ev.x-ox)/cellW),0,cols-1),i=r*cols+c;return i<its.length?i:-1;},
    mouse(ev){

      if(ev.type==='click'){const i=this.hit(ev);if(i>=0){this.setIdx(i,false);this.choose();return true;}
        // click on scroll arrows
        if(inBox){if(ev.y<this.y+12+titleH)this.scroll(-1);else if(ev.y>this.y+this.h-10)this.scroll(1);}return true;}
      if(ev.type==='wheel'){this.scroll(ev.delta>0?1:-1);return true;}
      if(ev.type==='drag'&&inBox){this.dragAcc+=ev.dy||0;while(this.dragAcc>o.rowH){this.dragAcc-=o.rowH;this.scroll(-1);}while(this.dragAcc<-o.rowH){this.dragAcc+=o.rowH;this.scroll(1);}return true;}
      if(ev.type==='context'){if(o.cancel)this.cancelMenu();return true;}
      if(ev.type==='down')return true;
      return inBox;
    },
    scroll(d){const n=items().length,nr=Math.ceil(n/cols);if(nr<=maxRows){this.setIdx(this.idx+d*cols);return;}
      const nt=clamp(this.top+d,0,nr-maxRows);if(nt===this.top)return;this.top=nt;const r=Math.floor(this.idx/cols);
      let ni=this.idx;if(r<nt)ni=this.idx+(nt-r)*cols;else if(r>=nt+maxRows)ni=this.idx-(r-nt-maxRows+1)*cols;
      ni=clamp(ni,0,n-1);if(ni!==this.idx){this.idx=ni;_usfx('move');if(o.onMove)o.onMove(ni);}},
    draw(){
      const its=items();this.ensure();
      const dark=o.dark!==false,col=dark?UI_COL.dtext:UI_COL.text,sh=dark?UI_COL.dshadow:UI_COL.shadow;
      if(o.prompt){
        let pw=o.promptW;if(!pw){const overl=this.y+this.h>MSG.y&&this.x>W*0.35;pw=overl?this.x-MSG.x-22:MSG.w-28;}
        _drawMsgBox(wrap(L2(o.prompt),pw).slice(0,3),null,false,{dark:o.promptDark,arrow:false});
      }
      if(!o.noBox)panel(this.x,this.y,this.w,this.h,{dark});
      if(o.title){txt(L2(o.title),this.x+10,this.y+7,dark?UI_COL.dgold:col,'left',FONT,sh);
        ctx.fillStyle=dark?'rgba(188,212,255,0.4)':UI_COL.blue;ctx.fillRect(this.x+6,this.y+titleH+3,this.w-12,1);}
      const oy=this.y+6+titleH,ox=this.x+10;
      for(let r=0;r<maxRows;r++){for(let c=0;c<cols;c++){
        const i=(this.top+r)*cols+c;if(i>=its.length)break;const it=its[i];
        const rx=ox+c*cellW,ry=oy+r*o.rowH,sel=i===this.idx;
        if(o.drawRow){o.drawRow(o.items[i],i,rx,ry,cellW,o.rowH,sel);if(sel&&o.cursor)_cursor(rx,ry+(o.rowH-7)/2|0,col);continue;}
        const ty=ry+Math.floor((o.rowH-8)/2);
        const gr=dark?UI_COL.dgray:UI_COL.gray,tc=it.disabled?gr:(it.col||col);
        txt(L2(it.label),rx+9,ty,tc,'left',FONT,it.disabled?null:sh);
        if(it.r!=null)txt(L2(it.r),rx+cellW-4,ty,it.disabled?gr:col,'right',FONT,it.disabled?null:sh);
        if(sel){if(dark){ctx.fillStyle='rgba(243,210,122,0.12)';ctx.fillRect(rx+5,ry,cellW-6,o.rowH);}_cursor(rx,ty,dark?UI_COL.dgold:col);}
      }}
      const nr=Math.ceil(its.length/cols);
      if(this.top>0)_arrow(this.x+this.w/2,this.y+titleH+3+Math.sin(now()*6),true,dark?UI_COL.dgold:'#e05038');
      if(this.top+maxRows<nr)_arrow(this.x+this.w/2,this.y+this.h-9-Math.sin(now()*6)*0.8,false,dark?UI_COL.dgold:'#e05038');
      if(o.info)o.info(this.idx);
    }
  };
  m.ensure();
  if(o.onMove)o.onMove(m.idx);
  o._w=m;
  return pushWidget(m);
}
function ask(q,o){
  o=o||{};const items=[t('u_yes'),t('u_no')];
  const w=Math.ceil(Math.max(textW(items[0]),textW(items[1])))+30,h=2*14+12;
  return menu({items,prompt:q,x:W-w-4,y:MSG.y-h-2,w,h,idx:o.idx||0,cancel:o.cancel!==false}).then(i=>i===0);

// numberPicker({min,max,val,x,y,w,label,fmt(n)}) → Promise<n|-1>
function numberPicker(o){
  o=Object.assign({min:1,max:99,val:1},o||{});
  const w=o.w||96,h=o.label?40:26,x=o.x!=null?o.x:W-w-4,y=o.y!=null?o.y:MSG.y-h-2;
  const p={v:clamp(o.val,o.min,o.max),
    set(v){v=clamp(v,o.min,o.max);if(v!==this.v){this.v=v;_usfx('move');}},
    input(a,rep){
      if(a==='up')this.set(this.v>=o.max&&!rep?o.min:this.v+1);else if(a==='down')this.set(this.v<=o.min&&!rep?o.max:this.v-1);
      else if(a==='right')this.set(this.v+10);else if(a==='left')this.set(this.v-10);
      else if(a==='ok'&&!rep){_usfx('ok');closeWidget(this,this.v);}else if(a==='back'&&!rep){_usfx('back');closeWidget(this,-1);}},
    mouse(ev){if(ev.type==='wheel'){this.set(this.v+(ev.delta>0?-1:1));return true;}
      if(ev.type==='click'){if(_inside(ev,x,y,w,h)){if(ev.y<y+h/2-4&&o.label)return true;if(ev.x<x+22)this.set(this.v-1);else if(ev.x>x+w-22)this.set(this.v+1);else{_usfx('ok');closeWidget(this,this.v);}}return true;}
      if(ev.type==='context'){_usfx('back');closeWidget(this,-1);return true;}return ev.type==='down';},
    draw(){panel(x,y,w,h,{dark:true});let yy=y+9;if(o.label){txt(L2(o.label),x+10,yy,UI_COL.dgold,'left',FONT,UI_COL.dshadow);yy+=14;}
      const s=o.fmt?o.fmt(this.v):'×'+String(this.v).padStart(2,'0');
      txt(s,x+w/2,yy,UI_COL.dtext,'center',FONT,UI_COL.dshadow);
      const b=Math.sin(now()*6)*0.8;_arrow(x+12,yy+2-b,true,UI_COL.dgold);_arrow(x+w-12,yy+2+b,false,UI_COL.dgold);}
  };
  return pushWidget(p);
}

// ---------- timed effects (not in the stack) ----------
const _fx={trans:null,cover:0,banners:[],big:[],toasts:[]};
let fadeOverlay={a:0,col:'#000000',from:0,to:0,t:0,d:0,res:null};
function fadeTo(a,ms,col){return new Promise(res=>{const f=fadeOverlay;if(f.res)f.res();f.from=f.a;f.to=clamp(a,0,1);f.t=0;f.d=Math.max(0.001,(ms==null?400:ms)/1000);if(col)f.col=col;f.res=res;});}
const fadeOut=(ms,col)=>fadeTo(1,ms,col);
const fadeIn=ms=>fadeTo(0,ms);
function transition(dir,ms){
  return new Promise(res=>{if(_fx.trans&&_fx.trans.res)_fx.trans.res();
    _fx.trans={dir:dir==='out'?'out':'in',t:0,d:(ms||450)/1000,res};});
}
function banner(top,main,o){o=o||{};return new Promise(res=>{_fx.banners=[{top:L2(top)||'',main:L2(main)||'',col:o.color||'#e8d8a8',d:o.dur||3.6,t:0,res}];});}
function bigText(text,o){o=o||{};return new Promise(res=>{_fx.big.push({text:L2(text),col:o.color||'#b01818',sub:o.sub?L2(o.sub):'',d:o.dur||5,t:0,res});});}
function toast(text,dur){_fx.toasts.push({text:L2(text),t:0,d:dur||2});if(_fx.toasts.length>4)_fx.toasts.shift();}

function uiUpdate(dt){
  const ws=ui.slice();for(let i=ws.length-1;i>=0;i--){const w=ws[i];if(ui.indexOf(w)>=0&&w.update){try{w.update(dt);}catch(e){console.error(e);}}}
  const tr=_fx.trans;
  if(tr){tr.t+=dt;const p=clamp(tr.t/tr.d,0,1);_fx.cover=tr.dir==='in'?p:1-p;if(p>=1){_fx.trans=null;if(tr.res)tr.res();}}
  const f=fadeOverlay;if(f.res||f.t<f.d){f.t+=dt;const p=clamp(f.t/f.d,0,1);f.a=lerp(f.from,f.to,p);if(p>=1&&f.res){const r=f.res;f.res=null;r();}}
  for(const arr of [_fx.banners,_fx.big]){for(let i=arr.length-1;i>=0;i--){const b=arr[i];b.t+=dt;if(b.t>=b.d){arr.splice(i,1);if(b.res)b.res();}}}
  for(let i=_fx.toasts.length-1;i>=0;i--){const q=_fx.toasts[i];q.t+=dt;if(q.t>=q.d)_fx.toasts.splice(i,1);}
}
function _env(t,d,fi,fo){return clamp(Math.min(t/fi,(d-t)/fo),0,1);}
function _spaced(s,x,y,sp,align){ // letter-spaced text, current font/fill
  let tw=0;const ws=[];for(const ch of s){const cw=ctx.measureText(ch).width;ws.push(cw);tw+=cw+sp;}tw-=sp;
  let cx=align==='center'?x-tw/2:align==='right'?x-tw:x;ctx.textAlign='left';let k=0;
  for(const ch of s){ctx.fillText(ch,cx,y);cx+=ws[k++]+sp;}return tw;
}
function _drawTransition(p){
  if(p<=0)return;ctx.save();ctx.fillStyle='#000';
  const n=9,bh=H/n,sk=60;
  for(let i=0;i<n;i++){
    const q=clamp(p*1.6-(i%2?0.06:0)-Math.abs(i-(n-1)/2)*0.05,0,1);if(q<=0)continue;
    const ease=1-Math.pow(1-q,3);const len=(W+sk+4)*ease;const y0=i*bh-0.5,y1=(i+1)*bh+0.5;
    ctx.beginPath();
    if(i%2===0){ctx.moveTo(-sk,y0);ctx.lineTo(-sk+len,y0);ctx.lineTo(-sk+len+sk*0.5,y1);ctx.lineTo(-sk,y1);}
    else{ctx.moveTo(W+sk,y0);ctx.lineTo(W+sk-len-sk*0.5,y0);ctx.lineTo(W+sk-len,y1);ctx.lineTo(W+sk,y1);}
    ctx.closePath();ctx.fill();
  }
  if(p>=1)ctx.fillRect(0,0,W,H);
  ctx.restore();
}
function _band(cy,bh,a,lines){
  const g=ctx.createLinearGradient(0,cy-bh/2,0,cy+bh/2);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.22,'rgba(0,0,0,0.72)');g.addColorStop(0.78,'rgba(0,0,0,0.72)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(0,cy-bh/2,W,bh);
  if(lines){for(const ly of [cy-bh/2+bh*0.16,cy+bh/2-bh*0.16]){const lg=ctx.createLinearGradient(0,0,W,0);
    lg.addColorStop(0,'rgba(200,170,90,0)');lg.addColorStop(0.5,'rgba(230,200,120,0.9)');lg.addColorStop(1,'rgba(200,170,90,0)');
    ctx.fillStyle=lg;ctx.fillRect(W*0.12,Math.round(ly),W*0.76,1);}}
}
function _drawBanner(b){
  const a=_env(b.t,b.d,0.8,1.0);if(a<=0)return;ctx.save();
  const cy=Math.round(H*0.42),bh=74;_band(cy,bh,a,true);
  ctx.globalAlpha=a;ctx.textBaseline='middle';
  if(b.top){ctx.font='8px Cinzel, Georgia, serif';ctx.fillStyle='#b8a880';_spaced(b.top.toUpperCase(),W/2,cy-14,3,'center');}
  let fs=22;ctx.font=fs+'px Cinzel, Georgia, serif';while(fs>12&&ctx.measureText(b.main).width+b.main.length*1.5>W-60){fs--;ctx.font=fs+'px Cinzel, Georgia, serif';}
  ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=6;ctx.fillStyle=b.col;
  _spaced(b.main,W/2,b.top?cy+7:cy,1.5,'center');
  ctx.restore();
}
function _drawBig(b){
  const a=_env(b.t,b.d,1.4,1.2);if(a<=0)return;ctx.save();
  const cy=Math.round(H*0.48),bh=96;_band(cy,bh,a*0.95,false);
  ctx.globalAlpha=a;ctx.textBaseline='middle';
  const sc=1+0.06*(b.t/b.d);ctx.translate(W/2,cy-(b.sub?6:0));ctx.scale(sc,sc);
  let fs=38;const fit=()=>{ctx.font=fs+'px Cinzel, Georgia, serif';let tw=0;for(const ch of b.text)tw+=ctx.measureText(ch).width+3;return tw;};
  while(fs>14&&fit()>W-56)fs-=2;ctx.shadowColor=b.col;ctx.shadowBlur=14;ctx.fillStyle=b.col;
  _spaced(b.text,0,0,3,'center');ctx.shadowBlur=0;ctx.globalAlpha=a*0.35;ctx.fillStyle='#000';
  ctx.restore();
  if(b.sub){ctx.save();ctx.globalAlpha=a*clamp((b.t-0.6)/1,0,1);ctx.textBaseline='middle';ctx.font='9px Cinzel, Georgia, serif';ctx.fillStyle='#c8b890';
    _spaced(b.sub.toUpperCase(),W/2,cy+26,2.5,'center');ctx.restore();}
}
function _drawToasts(){
  let y=6;for(const q of _fx.toasts){const a=_env(q.t,q.d,0.15,0.4);const w=Math.min(W-16,Math.ceil(textW(q.text))+20);
    ctx.save();ctx.globalAlpha=a;panel(W/2-w/2,y-(1-a)*6,w,20,{dark:true});ctx.restore();
    ctx.save();ctx.globalAlpha=a;txt(q.text,W/2,y+6-(1-a)*6,UI_COL.dtext,'center',FONT,UI_COL.dshadow);ctx.restore();y+=23;}
}
function uiRender(){
  ctx.save();ctx.imageSmoothingEnabled=false;
  for(const w of ui.slice()){try{ctx.save();w.draw();ctx.restore();}catch(e){ctx.restore();console.error(e);}}
  _drawTransition(_fx.cover);
  const f=fadeOverlay;if(f.a>0){ctx.globalAlpha=f.a;ctx.fillStyle=f.col;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  for(const b of _fx.banners)_drawBanner(b);
  for(const b of _fx.big)_drawBig(b);
  _drawToasts();
  ctx.restore();
}

// ---------- starter selection ----------
function pickStarter(ids){
  const n=ids.length,gap=Math.min(150,(W-40)/n),px=i=>W/2+(i-(n-1)/2)*gap,py=150;
  const spName=id=>{const s=typeof SPECIES!=='undefined'&&SPECIES[id];return s?L2(s.name):id;};
  const spType=id=>{const s=typeof SPECIES!=='undefined'&&SPECIES[id];return s?s.t:'normal';};
  const w={idx:0,t:0,
    update(dt){this.t+=dt;},
    set(i){i=(i+n)%n;if(i!==this.idx){this.idx=i;_usfx('move');}},
    input(a,rep){if(a==='left'||a==='up')this.set(this.idx-1);else if(a==='right'||a==='down')this.set(this.idx+1);
      else if(a==='ok'&&!rep){_usfx('ok');closeWidget(this,this.idx);}},
    hit(ev){for(let i=0;i<n;i++)if(Math.abs(ev.x-px(i))<gap/2&&ev.y>50&&ev.y<H-50)return i;return -1;},
    mouse(ev){const i=this.hit(ev);if(ev.type==='move'){if(i>=0)this.set(i);return true;}
      if(ev.type==='click'){if(i>=0){if(i!==this.idx)this.set(i);else{_usfx('ok');closeWidget(this,i);}}return true;}
      if(ev.type==='wheel'){this.set(this.idx+(ev.delta>0?1:-1));return true;}return true;},
    draw(){
      const g=ctx.createRadialGradient(W/2,H*0.55,20,W/2,H*0.55,W*0.6);g.addColorStop(0,'rgba(30,30,50,0.55)');g.addColorStop(1,'rgba(0,0,8,0.88)');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      panel(W/2-130,10,260,24);txt(t('u_pick'),W/2,18,UI_COL.text,'center',FONT,true);
      for(let i=0;i<n;i++){
        const id=ids[i],sel=i===this.idx,x=px(i),tp=spType(id),tc=(typeof TYPE_COL!=='undefined'&&TYPE_COL[tp])||'#888';
        // light beam behind selected
        if(sel){const lg=ctx.createLinearGradient(0,40,0,py+10);lg.addColorStop(0,'rgba(255,240,200,0)');lg.addColorStop(1,'rgba(255,240,200,0.22)');
          ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(x-18,40);ctx.lineTo(x+18,40);ctx.lineTo(x+50,py+6);ctx.lineTo(x-50,py+6);ctx.closePath();ctx.fill();}
        // pedestal
        ctx.save();
        ctx.fillStyle='#2a2630';ctx.beginPath();ctx.ellipse(x,py+12,46,11,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#5a5466';ctx.fillRect(x-44,py,88,12);
        ctx.fillStyle=sel?shade(tc,-0.1):'#8a8496';ctx.beginPath();ctx.ellipse(x,py,44,10,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=sel?shade(tc,0.35):'#aaa4b6';ctx.beginPath();ctx.ellipse(x,py-1,36,7,0,0,Math.PI*2);ctx.fill();
        ctx.restore();
        // monster ×3
        let c=null;try{if(typeof monSprite==='function')c=monSprite(id);}catch(e){}
        if(c){const k=3,bob=sel?Math.round(Math.sin(this.t*5)*2.5)-2:0;ctx.save();ctx.imageSmoothingEnabled=false;if(!sel)ctx.globalAlpha=0.6;
          ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x,py,c.width*k*0.32,5,0,0,Math.PI*2);ctx.fill();
          ctx.drawImage(c,Math.round(x-c.width*k/2),Math.round(py-c.height*k+4+bob),c.width*k,c.height*k);ctx.restore();}
        // name + type
        const nm=spName(id);txt(nm,x,py+28,sel?'#ffffff':'#9890a8','center',FONT,'#000');
        const bw=textW(L2((typeof TYPE_N!=='undefined'&&TYPE_N[tp])||tp).toUpperCase())+10;
        ctx.save();if(!sel)ctx.globalAlpha=0.6;typeBadge(tp,Math.round(x-bw/2),py+42);ctx.restore();
        if(sel)_cursor(x-textW(nm)/2-12,py+28,'#ffd860');
      }
      txt(t('u_pick_hint'),W/2,H-16,'#8880a0','center',FONT,'#000');
    }
  };
  return pushWidget(w);
}

// ---------- helpers ----------
const P_INK='#383840', P_DIM='#8a8a96';
function _psfx(n){if(typeof sfx==='function'){try{sfx(n);}catch(e){}}}
function _ptxt(s,x,y,col,align,font){ctx.save();ctx.font=font||FONT;ctx.textBaseline='top';ctx.textAlign=align||'left';
  ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillText(String(s),x+1,y+1);ctx.fillStyle=col||P_INK;ctx.fillText(String(s),x,y);ctx.restore();}
function _pFit(s,maxW){s=String(s);ctx.save();ctx.font=FONT;while(s.length>1&&ctx.measureText(s).width>maxW)s=s.slice(0,-1);ctx.restore();return s;}
function _spTypes(sp){return sp?[].concat(sp.t||[]).filter(Boolean):[];}
function _spName(id){const sp=SPECIES[id];return sp?L2(sp.name):id;}
function _mName(m){try{return monName(m);}catch(e){return _spName(m.sp);}}
function _mStats(m){try{return stats(m);}catch(e){return{hp:m.hp||1,atk:1,def:1,spd:1,ep:m.ep||1};}}
function _sprite(id){try{return monSprite(id);}catch(e){return null;}}
const _silCache={};
function _silhouette(id){if(_silCache[id])return _silCache[id];const s=_sprite(id);if(!s)return null;
  const c=document.createElement('canvas');c.width=s.width;c.height=s.height;const g=c.getContext('2d');
  g.drawImage(s,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#3a3a4a';g.fillRect(0,0,c.width,c.height);
  return(_silCache[id]=c);}
function _drawSp(id,x,y,size,opt){opt=opt||{};const s=opt.sil?_silhouette(id):_sprite(id);if(!s)return;
  ctx.save();ctx.imageSmoothingEnabled=false;if(opt.gray){ctx.globalAlpha=0.55;try{ctx.filter='grayscale(1)';}catch(e){}}
  const k=size/Math.max(s.width,s.height);const w=Math.round(s.width*k),h=Math.round(s.height*k);
  ctx.drawImage(s,Math.round(x+(size-w)/2),Math.round(y+(size-h)/2),w,h);ctx.restore();}
function _rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h);}
function _bar(x,y,w,h,ratio,col){ctx.save();_rect(x,y,w,h,'#404048');_rect(x+1,y+1,w-2,h-2,'#e8e8e0');
  _rect(x+1,y+1,Math.round((w-2)*clamp(ratio,0,1)),h-2,col);ctx.restore();}
const P_ST_COL={burn:'#e0603a',poison:'#a050c0',para:'#d0a820',sleep:'#7d8a9a',frz:'#52b8e0'};
function _stTag(m,x,y){let k=null,col;if(m.hp<=0){k='p_st_ko';col='#c03030';}
  else if(m.st&&m.st.k){k='p_st_'+m.st.k;col=P_ST_COL[m.st.k]||'#888';}
  if(!k)return 0;const s=t(k);ctx.save();ctx.font=FONT;const w=Math.ceil(ctx.measureText(s).width)+6;
  _rect(x,y,w,11,col);_ptxt(s,x+3,y+2,'#fff');ctx.restore();return w;}
function _hpCol(r){return r>0.5?'#48c060':r>0.2?'#e0b030':'#e04838';}
function _hpBar(x,y,w,h,r){try{if(typeof hpBar==='function'){hpBar(x,y,w,h,r);return;}}catch(e){}_bar(x,y,w,h,r,_hpCol(r));}
function _badge(tp,x,y){try{if(typeof typeBadge==='function')return typeBadge(tp,x,y)||40;}catch(e){}
  const s=L2((typeof TYPE_N!=='undefined'&&TYPE_N[tp])||tp).toUpperCase();ctx.save();ctx.font=FONT;
  const w=Math.ceil(ctx.measureText(s).width)+6;_rect(x,y,w,11,(TYPE_COL&&TYPE_COL[tp])||'#888');_ptxt(s,x+3,y+2,'#fff');ctx.restore();return w;}
function _panel(x,y,w,h,o){try{panel(x,y,w,h,o||{});}catch(e){ctx.fillStyle='#f8f8f0';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#404048';ctx.strokeRect(x+.5,y+.5,w-1,h-1);}}
function _wrap(s,mw){try{const r=wrap(s,mw);if(Array.isArray(r))return r;}catch(e){}return String(s).split('\n');}
// passive widget that only draws (stays under menus)
function _bgWidget(drawFn){const w={draw(){ctx.save();try{drawFn();}catch(e){}ctx.restore();},input(){},mouse(){return false;}};pushWidget(w);return w;}
function _closeBg(w){try{closeWidget(w,null);}catch(e){}}
function _invIds(){if(!game||!game.items)return[];const order=Object.keys(ITEMS);
  return Object.keys(game.items).filter(id=>game.items[id]>0&&ITEMS[id]).sort((a,b)=>order.indexOf(a)-order.indexOf(b));}
function _aliveCount(arr,exceptIdx){let n=0;arr.forEach((m,i)=>{if(i!==exceptIdx&&m.hp>0)n++;});return n;}

// ---------- mon row ----------
function drawMonRow(mon,x,y,w,h,sel){if(!mon)return;ctx.save();
  const st=_mStats(mon),dead=mon.hp<=0,r=st.hp?mon.hp/st.hp:0;
  if(sel){ctx.fillStyle='rgba(90,140,230,0.18)';ctx.fillRect(x+1,y+1,w-2,h-2);}
  if(dead){ctx.fillStyle='rgba(120,120,130,0.18)';ctx.fillRect(x+1,y+1,w-2,h-2);}
  _drawSp(mon.sp,x+4,y+Math.floor((h-24)/2),24,{gray:dead});
  const tc=dead?P_DIM:P_INK,nx=x+34,ty=y+Math.max(2,Math.floor(h/2)-12);
  const lv=t('p_lv')+mon.lv;ctx.font=FONT;const lvW=ctx.measureText(lv).width;
  _ptxt(_pFit(_mName(mon),w-34-lvW-50),nx,ty,tc);
  _ptxt(lv,x+w-6,ty,tc,'right');
  const tagW=_stTag(mon,x+w-6-lvW-44,ty-2);void tagW;
  const by=ty+13,bw=Math.min(110,w-34-96);
  _ptxt(t('p_hp'),nx,by,dead?P_DIM:'#c08020');
  _hpBar(nx+20,by+1,bw,6,r);
  _ptxt(Math.max(0,mon.hp)+'/'+st.hp,x+w-6,by,tc,'right');
  ctx.restore();}

// ---------- team ----------
function _drawTeamSide(mon,hint){const x=316,y=8,w=156,h=254;_panel(x,y,w,h);
  if(mon){const st=_mStats(mon),dead=mon.hp<=0;
    _rect(x+10,y+10,w-20,80,'#dfe6f0');_drawSp(mon.sp,x+(w-72)/2,y+14,72,{gray:dead});
    _ptxt(_pFit(_mName(mon),w-16),x+w/2,y+96,P_INK,'center');
    let bx=x+10;for(const tp of _spTypes(SPECIES[mon.sp]))bx+=_badge(tp,bx,y+110)+3;
    _ptxt(t('p_lv')+' '+mon.lv,x+w-10,y+111,P_INK,'right');
    _ptxt(t('p_hp')+' '+Math.max(0,mon.hp)+'/'+st.hp,x+10,y+128);
    _ptxt(t('p_ep_s')+' '+Math.max(0,mon.ep|0)+'/'+st.ep,x+10,y+141);
    _ptxt(t('p_atk')+' '+st.atk,x+10,y+158);_ptxt(t('p_def')+' '+st.def,x+10,y+171);_ptxt(t('p_spd')+' '+st.spd,x+10,y+184);
    _stTag(mon,x+w-40,y+128);}

async function _teamPick(o){ // generic party list -> idx | -1 | 'box'
  const party=game.party,items=party.map(m=>({label:_mName(m),mon:m}));
  if(o.boxRow)items.push({label:t('p_box',game.box.length),box:true});
  let cur=clamp(o.idx||0,0,items.length-1);
  const bg=_bgWidget(()=>{const it=items[cur];_drawTeamSide(it&&it.mon,o.hint||'');});
  const r=await menu({items,x:8,y:8,w:300,rowH:32,maxRows:7,idx:cur,cancel:o.cancel!==false,title:o.title||t('p_team_t'),
    onMove:i=>{cur=i;},
    drawRow:(it,i,x,y,w,h,sel)=>{if(it.mon)drawMonRow(it.mon,x,y,w,h,sel);else{ctx.save();
      if(sel){ctx.fillStyle='rgba(90,140,230,0.18)';ctx.fillRect(x+1,y+1,w-2,h-2);}
      _ptxt(it.label,x+34,y+Math.floor(h/2)-4,P_INK);ctx.restore();}}});
  _closeBg(bg);
  if(r>=0&&items[r]&&items[r].box)return'box';return r;}

async function teamMenu(o){o=o||{};const mode=o.mode||'world';if(!game||!game.party)return -1;
  if(mode==='item'){const nm=o.item&&ITEMS[o.item]?L2(ITEMS[o.item].n):'';
    return await _teamPick({hint:t('p_item_on',nm),cancel:true});}
  if(mode==='battle'||mode==='forced'){let idx=o.active!=null&&o.active!==0?0:Math.min(1,game.party.length-1);
    for(;;){const r=await _teamPick({idx,cancel:mode!=='forced',hint:mode==='forced'?t('p_forced'):t('p_choose_mon')});
      if(r<0){if(mode==='forced')continue;return -1;}idx=r;const m=game.party[r];
      const c=await menu({items:[t('p_switch'),t('p_summary'),t('p_cancel')],x:316,y:150,w:156,cancel:true});
      if(c===1){await showSummary(m,game.party);continue;}
      if(c!==0)continue;
      if(r===o.active){await say(t('p_in_battle',_mName(m)));continue;}
      if(m.hp<=0){await say(t('p_fainted',_mName(m)));continue;}
      _psfx('ok');return r;}}
  // world
  let idx=0;
  for(;;){if(!game.party.length)return -1;
    const r=await _teamPick({idx,cancel:true,boxRow:true,hint:''});
    if(r==='box'){await boxMenu();idx=game.party.length;continue;}
    if(r<0)return -1;idx=r;const m=game.party[r];
    const opts=[t('p_summary'),{label:t('p_leader'),disabled:r===0},{label:t('p_move'),disabled:game.party.length<2},
      t('p_useitem'),{label:t('p_tobox'),disabled:game.party.length<=1}];
    const c=await menu({items:opts,x:316,y:120,w:156,cancel:true});
    if(c===0){await showSummary(m,game.party);}
    else if(c===1&&r>0){game.party.splice(r,1);game.party.unshift(m);idx=0;_psfx('ok');await say(t('p_lead_set',_mName(m)));}
    else if(c===2&&game.party.length>1){const j=await _teamPick({idx:r,cancel:true,hint:t('p_pick_swap',_mName(m))});
      if(typeof j==='number'&&j>=0&&j!==r){const o2=game.party[j];game.party[j]=m;game.party[r]=o2;idx=j;_psfx('ok');
        await say(t('p_swapped',_mName(m),_mName(o2)));}}
    else if(c===3){await _useItemOn(m);}
    else if(c===4&&game.party.length>1){
      if(m.hp>0&&_aliveCount(game.party,r)===0){_psfx('deny');await say(t('p_last_alive'));}
      else{game.party.splice(r,1);game.box.push(m);idx=Math.min(idx,game.party.length-1);_psfx('ok');await say(t('p_boxed',_mName(m)));}}
  }}

async function _useItemOn(mon){
  for(;;){const ids=_invIds().filter(id=>!ITEMS[id].catch);
    if(!ids.length){await say(t('p_no_usable'));return;}
    const r=await menu({items:ids.map(id=>({label:L2(ITEMS[id].n),r:'x'+game.items[id]})),x:316,y:100,w:156,maxRows:8,cancel:true,title:t('p_bag_t')});
    if(r<0)return;const msg=applyItem(ids[r],mon);
    if(msg){_psfx('heal');await say(msg);return;}else{_psfx('deny');await say(t('p_noeffect'));}}}

// ---------- items ----------
function _itemCore(id,mon){const it=ITEMS[id];if(!it||!mon||it.catch)return null;
  const st=_mStats(mon),nm=_mName(mon),msgs=[];
  if(it.revive){if(mon.hp>0)return null;mon.hp=Math.max(1,Math.floor(st.hp*(it.revive>1?1:it.revive)));mon.st=null;
    msgs.push(t('p_revive',nm));return msgs.join(' ');}
  if(mon.hp<=0)return null;
  if(it.heal){const amt=it.heal<=1?Math.ceil(st.hp*it.heal):it.heal;const d=Math.min(st.hp-mon.hp,amt);
    if(d>0){mon.hp+=d;msgs.push(t('p_heal',nm,d));}}
  if(it.ep){const mx=st.ep,cur=mon.ep|0,amt=it.ep<=1?Math.ceil(mx*it.ep):it.ep;const d=Math.min(mx-cur,amt);
    if(d>0){mon.ep=cur+d;msgs.push(t('p_ep',nm,d));}}
  if(it.cure&&mon.st){mon.st=null;msgs.push(t('p_cure',nm));}
  return msgs.length?msgs.join(' '):null;}
function itemHasEffect(id,mon){if(!mon)return false;return _itemCore(id,JSON.parse(JSON.stringify(mon)))!==null;}
function applyItem(id,mon){if(!game||!game.items||!(game.items[id]>0))return null;
  const msg=_itemCore(id,mon);if(msg==null)return null;
  game.items[id]--;if(game.items[id]<=0)delete game.items[id];return msg;}

function _drawItemInfo(id,extra){const x=316,y=8,w=156,h=130;_panel(x,y,w,h);if(!id||!ITEMS[id])return;const it=ITEMS[id];
  _ptxt(_pFit(L2(it.n),w-16),x+8,y+8,P_INK);
  _wrap(L2(it.d)||'',w-16).slice(0,7).forEach((l,i)=>_ptxt(l,x+8,y+24+i*12,'#505060'));
  if(extra)_ptxt(extra,x+8,y+h-16,'#a07020');}

// ---------- summary ----------
function showSummary(mon,list){if(!mon)return Promise.resolve();
  let arr=Array.isArray(list)?list:(game&&game.party&&game.party.indexOf(mon)>=0?game.party:null);
  let i=arr?Math.max(0,arr.indexOf(mon)):0;let m=mon;
  const w={draw(){ctx.save();_drawSummary(m,arr&&arr.length>1);ctx.restore();},
    input(a,rep){if(a==='left'||a==='right'){if(arr&&arr.length>1){i=(i+(a==='right'?1:arr.length-1))%arr.length;m=arr[i];_psfx('move');}return;}
      if((a==='ok'||a==='back'||a==='menu')&&!rep){_psfx('back');closeWidget(w,null);}},
    mouse(ev){if(ev.type==='click'||ev.type==='context'){_psfx('back');closeWidget(w,null);}else if(ev.type==='wheel'&&arr&&arr.length>1){
      i=(i+(ev.delta>0?1:arr.length-1))%arr.length;m=arr[i];}return true;}};
  return pushWidget(w);}

  _ptxt(_pFit(_mName(m),160),94,140,P_INK,'center');

  // exp
  const e0=expFor(m.lv),e1=expFor(m.lv+1),er=e1>e0?(m.exp-e0)/(e1-e0):1;
  _ptxt(t('p_exp')+' '+(m.exp|0),14,194);_bar(14,206,160,6,er,'#4890e0');

  _ptxt(t('p_hp'),rx,16,'#c08020');_hpBar(rx+28,17,150,7,st.hp?m.hp/st.hp:0);_ptxt(Math.max(0,m.hp)+'/'+st.hp,W-16,16,P_INK,'right');
  _ptxt(t('p_ep_s'),rx,30,'#3070c0');_bar(rx+28,31,150,7,st.ep?(m.ep|0)/st.ep:0,'#50a0f0');_ptxt(Math.max(0,m.ep|0)+'/'+st.ep,W-16,30,P_INK,'right');
  [['p_atk',st.atk],['p_def',st.def],['p_spd',st.spd]].forEach(([k,v],j)=>{const x=rx+j*94;
    _rect(x,46,88,24,'#e6e8f0');_ptxt(t(k),x+44,49,'#606070','center');_ptxt(v,x+44,60,P_INK,'center');});
  _ptxt(t('p_moves'),rx,80,'#a07020');

async function _qtyMenu(price,max,title){const qs=[1,5,10];const items=qs.map(q=>({label:t('p_qty',q,q*price),disabled:q>max,q}));
  if(max>10&&title==='sell')items.push({label:t('p_all')+' ('+max+')',q:max});
  const r=await menu({items,x:316,y:150,w:156,cancel:true,title:t('p_howmany')});return r<0?0:items[r].q;}
async function shopMenu(li){if(!game)return;await say(t('p_shop_hi'));
  let top=0;
  for(;;){const c=await menu({items:[t('p_buy'),t('p_sell'),t('p_leave')],x:8,y:8,w:140,idx:top,cancel:true,title:t('p_gold',game.gold)});
    if(c<0||c===2)break;top=c;
    if(c===0){let stock=[];try{stock=(shopStock(li)||[]).filter(id=>ITEMS[id]);}catch(e){}let idx=0;
      for(;;){let cur=idx;const bg=_bgWidget(()=>_drawItemInfo(stock[cur],t('p_owned',game.items[stock[cur]]||0)));
        const r=await menu({items:stock.map(id=>({label:L2(ITEMS[id].n),r:t('p_gold',ITEMS[id].price),disabled:game.gold<ITEMS[id].price})),
          x:8,y:8,w:300,maxRows:12,idx,cancel:true,title:t('p_shop_t',game.gold),onMove:i=>{cur=i;}});
        _closeBg(bg);if(r<0)break;idx=r;const id=stock[r],pr=ITEMS[id].price|0;
        if(game.gold<pr){_psfx('deny');await say(t('p_nogold'));continue;}
        const q=await _qtyMenu(pr,pr>0?Math.floor(game.gold/pr):99,'buy');if(!q)continue;
        if(game.gold<q*pr){_psfx('deny');await say(t('p_nogold'));continue;}
        game.gold-=q*pr;game.items[id]=(game.items[id]||0)+q;_psfx('buy');await say(t('p_bought',L2(ITEMS[id].n),q));}}
    else if(c===1){let idx=0;
      for(;;){const ids=_invIds().filter(id=>(ITEMS[id].price|0)>0);if(!ids.length){await say(t('p_nothing_sell'));break;}
        idx=clamp(idx,0,ids.length-1);let cur=idx;
        const bg=_bgWidget(()=>_drawItemInfo(ids[cur],t('p_owned',game.items[ids[cur]]||0)));
        const r=await menu({items:ids.map(id=>({label:L2(ITEMS[id].n)+' x'+game.items[id],r:t('p_gold',Math.floor(ITEMS[id].price/2))})),
          x:8,y:8,w:300,maxRows:12,idx,cancel:true,title:t('p_sell_t',game.gold),onMove:i=>{cur=i;}});
        _closeBg(bg);if(r<0)break;idx=r;const id=ids[r],pr=Math.floor(ITEMS[id].price/2);
        const q=await _qtyMenu(pr,game.items[id],'sell');if(!q)continue;const n=Math.min(q,game.items[id]);
        game.items[id]-=n;if(game.items[id]<=0)delete game.items[id];game.gold+=n*pr;_psfx('buy');
        await say(t('p_sold',L2(ITEMS[id].n),n,n*pr));}}}
  await say(t('p_shop_bye'));}
