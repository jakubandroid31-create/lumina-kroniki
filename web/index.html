let battle=null;

// ---------- safe wrappers ----------
function _bSfx(n){try{if(typeof sfx==='function')sfx(n);}catch(e){}}
function _bMusic(k){try{if(typeof playMusic==='function')playMusic(k);}catch(e){}}
function _bJingle(n){try{if(typeof playJingle==='function'){const p=playJingle(n);if(p&&p.then)return Promise.race([p,sleep(5000)]);}}catch(e){}return Promise.resolve();}
function _bRumble(ms){try{vibrate(ms);}catch(e){}try{if(typeof padRumble==='function'&&SET.padVibrate)padRumble(ms);}catch(e){}}
async function _bTrans(d){try{if(typeof transition==='function')await transition(d);}catch(e){}}
function _bSay(s){return say(s,{auto:true});}
function _bW(ms){return SET.battleAnim?sleep(ms):Promise.resolve();}
function _bMv(id){return (typeof MOVES!=='undefined'&&MOVES[id])||(MOVES&&MOVES.tackle)||{n:['Atak','Tackle'],t:'normal',p:40,a:100,ep:0};}
function _bSp(m){return SPECIES[m.sp]||{t:'normal',c:null,x:50,cr:0.3,evo:null,boss:false,name:m.sp};}
function _bName(m){try{return monName(m);}catch(e){return String(m.sp);}}
function _bSt(m){try{return stats(m);}catch(e){return{hp:m.hp||1,atk:10,def:10,spd:10,ep:20};}}
function _bA(){return game.party[battle.ai];}
function _bE(){return battle.team[battle.ei];}
function _bDiff(){return (typeof DIFF!=='undefined'&&DIFF[SET.difficulty])||{mul:1,xp:1,gold:1};}
function _bPartyName(){return (game&&game.name)||t('b_player');}
function _bChance(c){if(c==null)return 1;return c>1?c/100:c;}
function _bCanUse(m,id){const mv=_bMv(id);return id==='tackle'||!mv.ep||m.ep>=mv.ep;}
function _bImmune(m,k){const tp=_bSp(m).t;return (k==='burn'&&tp==='fire')||(k==='frz'&&tp==='ice')||(k==='para'&&tp==='volt')||(k==='poison'&&tp==='shadow');}
function _bNewAn(){return{vis:false,lunge:0,shake:0,blink:0,faint:0,faintTo:0,app:1,appTo:1,suck:0,suckTo:0,flash:0};}

// ---------- main entry ----------
async function runBattle(o){
  o=o||{};
  const team=(o.team||[]).filter(Boolean);
  if(o.final&&team.length<2&&typeof SPECIES!=='undefined'&&SPECIES.eclipsor2&&typeof createMon==='function'){
    const b=team[0];team.push(createMon('eclipsor2',(b?b.lv:50)+2,b&&b.mul?Object.assign({},b.mul):undefined));
  }
  let ai=game.party.findIndex(m=>m&&m.hp>0);
  if(!team.length)return 'win';
  if(ai<0)return 'lose';
  battle={kind:o.kind||'wild',o,final:!!o.final,tname:L2(o.tname)||'',team,ei:0,ai,
    stages:{a:{atk:0,def:0},e:{atk:0,def:0}},dA:game.party[ai].hp,dE:team[0].hp,
    an:{a:_bNewAn(),e:_bNewAn()},parts:[],evo:new Set(),runs:0,showA:false,showE:false,
    flash:0,particles:[],orb:null,mvInfo:null,ev:null,lastCmd:0,over:false};
  let res='run';
  try{res=await _bMain();}catch(e){console.error('battle error',e);res=_bE()&&_bE().hp<=0?'win':'run';}
  battle.over=true;battle.mvInfo=null;
  if(res==='lose')return 'lose';
  try{
    if(res==='win'||res==='caught'){
      for(const m of game.party.concat(game.box||[]))if(battle.evo.has(m)&&m.hp>0)await _bEvolve(m);
    }
    if(!game.party.some(m=>m.hp>0)&&game.party[0]){game.party[0].hp=1;await _bSay(t('b_revive',_bName(game.party[0])));}
  }catch(e){console.error(e);}
  battle.stages={a:{atk:0,def:0},e:{atk:0,def:0}};
  await _bTrans('in');
  scene='world';
  try{_bMusic(LEVELS[world.li].music);}catch(e){}
  battle=null;
  await _bTrans('out');
  return res;
}

async function _bMain(){
  const B=battle;
  _bSfx('enc');
  await _bTrans('in');
  scene='battle';
  _bMusic(B.final?'final':B.kind==='boss'?'boss':B.kind==='trainer'?'trainer':'battle');
  const E=_bE();
  _bSeen(E);
  B.an.e.vis=true;
  if(B.kind!=='wild'){B.an.e.app=0;B.an.e.appTo=0;}
  await _bTrans('out');
  if(B.kind==='wild'){B.showE=true;await _bSay(t('b_wild',_bName(E)));}
  else if(B.kind==='trainer'){
    await _bSay(t('b_trainer',B.tname||'?'));
    await _bSendEnemy(true);
  }else{
    await _bSendEnemy(false);
    await _bSay(t('b_boss',_bName(E)));
  }
  await _bSendAlly();
  // main loop
  for(let turn=0;turn<2000;turn++){
    const act=await _bCommand();
    const r=await _bTurn(act);
    if(r)return r;
  }
  return 'run';
}

function _bSeen(m){if(game){game.seen=game.seen||{};game.seen[m.sp]=true;}}

async function _bSendEnemy(msg){
  const B=battle,E=_bE();
  _bSeen(E);
  B.dE=E.hp;B.stages.e={atk:0,def:0};
  B.an.e=_bNewAn();B.an.e.vis=true;B.an.e.app=0;B.an.e.appTo=1;B.an.e.flash=1;
  if(msg)await _bSay(t('b_sends',B.tname||'?',_bName(E)));
  _bSfx('door');B.showE=true;
  if(!SET.battleAnim)B.an.e.app=1;
  await _bW(450);
}
async function _bSendAlly(){
  const B=battle,A=_bA();
  B.dA=A.hp;B.stages.a={atk:0,def:0};
  if(!B.parts.includes(A))B.parts.push(A);
  B.an.a=_bNewAn();B.an.a.vis=true;B.an.a.app=0;B.an.a.appTo=1;B.an.a.flash=1;
  if(!SET.battleAnim)B.an.a.app=1;
  _bSfx('ok');
  const p=_bSay(t('b_go',_bName(A)));
  B.showA=true;
  await p;
  await _bW(200);
}

// ---------- commands ----------
async function _bCommand(){
  const B=battle;
  for(let guard=0;guard<500;guard++){
    const A=_bA();
    const c=await menu({items:[t('b_fight'),t('b_bag'),t('b_team'),t('b_run')],x:W-196,y:H-62,w:192,h:58,cols:2,rowH:20,
      cancel:false,idx:B.lastCmd||0,prompt:t('b_what',_bName(A)),promptW:W-204});
    if(c<0)continue;
    B.lastCmd=c;
    if(c===0){
      const r=await _bFightMenu(A);
      if(r)return r;
    }else if(c===1){
      let r=null;
      try{r=await bagMenu({battle:true,wild:B.kind==='wild'});}catch(e){console.error(e);r=null;}
      if(!r||!r.id)continue;
      const it=(typeof ITEMS!=='undefined'&&ITEMS[r.id])||{};
      if(it.catch){
        if(B.kind!=='wild'){await _bSay(t('b_nocatch'));continue;}
        return{type:'catch',id:r.id};
      }
      let tg=r.target;
      if(typeof tg==='number')tg=game.party[tg];
      if(!tg)tg=A;
      let msg=null;
      try{msg=applyItem(r.id,tg);}catch(e){console.error(e);msg=null;}
      if(msg==null){_bSfx('deny');await _bSay(t('b_noeff'));continue;}
      return{type:'item',msg,mon:tg};
    }else if(c===2){
      let i=-1;
      try{i=await teamMenu({mode:'battle',active:B.ai});}catch(e){console.error(e);i=-1;}
      if(i==null||i<0||i===B.ai||!game.party[i]||game.party[i].hp<=0)continue;
      return{type:'switch',idx:i};
    }else if(c===3){
      if(B.kind!=='wild'){_bSfx('deny');await _bSay(t('b_norun'));continue;}
      return{type:'run'};
    }
  }
  return{type:'move',id:'tackle'};
}

async function _bFightMenu(A){
  const B=battle;
  const moves=(A.moves&&A.moves.length)?A.moves.slice(0,4):['tackle'];
  if(!moves.some(id=>_bCanUse(A,id))){await _bSay(t('b_noep',_bName(A)));return{type:'move',id:'tackle'};}
  let idx=0;
  for(let guard=0;guard<200;guard++){
    const items=moves.map(id=>{const mv=_bMv(id);return{label:L2(mv.n),disabled:!_bCanUse(A,id),col:(typeof TYPE_COL!=='undefined'&&TYPE_COL[mv.t])||undefined};});
    B.mvInfo=moves[idx];
    const r=await menu({items,x:4,y:H-62,w:W-186,h:58,cols:2,rowH:20,cancel:true,idx,onMove:i=>{if(battle&&moves[i])battle.mvInfo=moves[i];}});
    B.mvInfo=null;
    if(r==null||r<0)return null;
    idx=r;
    if(!_bCanUse(A,moves[r])){_bSfx('deny');await _bSay(t('b_lowep'));continue;}
    return{type:'move',id:moves[r]};
  }
  return null;
}

// ---------- AI ----------
function _bAI(){
  const B=battle,E=_bE(),A=_bA();
  const moves=(E.moves&&E.moves.length)?E.moves:['tackle'];
  const smart=B.kind==='wild'?0.3:B.kind==='trainer'?0.6:0.85;
  if(Math.random()>smart)return pick(moves);
  const es=_bSt(E),sp=_bSp(E);
  let best=[],bs=-1;
  for(const id of moves){
    const mv=_bMv(id);let s=0;
    if(mv.p>0){
      let eff=1;try{eff=effOf(mv.t,_bSp(A).t);}catch(e){}
      const stab=(mv.t===sp.t||mv.t===sp.c)?1.5:1;
      s=mv.p*eff*stab*((mv.a==null?100:mv.a)/100);
      if(mv.st&&!A.st)s+=10;
    }else{
      if(mv.st&&!A.st&&!_bImmune(A,mv.st[0]))s+=55;
      if(mv.buff&&B.stages.e[mv.buff[0]]<2)s+=B.stages.e[mv.buff[0]]<=0?45:20;
      if(mv.debuff&&B.stages.a[mv.debuff[0]]>-2)s+=35;
      if(mv.heal){const r=E.hp/es.hp;s+=r<0.35?150:r<0.6?50:0;}
    }
    s*=0.9+Math.random()*0.2;
    if(s>bs){bs=s;best=[id];}else if(s===bs)best.push(id);
  }
  return best.length?pick(best):pick(moves);
}

// ---------- turn ----------
function _bSpeed(m){return _bSt(m).spd*(m.st&&m.st.k==='para'?0.5:1);}

async function _bTurn(act){
  const B=battle;
  let am=null;
  if(act.type==='run'){
    B.runs++;
    const as=_bSpeed(_bA()),es=Math.max(1,_bSpeed(_bE()));
    const ch=(as*128/es+30*(B.runs-1))/256;
    if(as>=es||Math.random()<ch){_bSfx('door');await _bSay(t('b_ran'));return 'run';}
    await _bSay(t('b_noran'));
  }else if(act.type==='switch'){
    const old=_bA();
    await _bSay(t('b_back',_bName(old)));
    B.an.a.appTo=0;await _bW(300);
    B.ai=act.idx;
    await _bSendAlly();
  }else if(act.type==='item'){
    _bSfx('heal');
    await _bSay(act.msg);
    await _bWaitHp();
  }else if(act.type==='catch'){
    if(await _bCatch(act.id))return 'caught';
  }else am=act.id;
  const em=_bAI();
  if(am){
    const A=_bA(),E=_bE();
    const pa=_bMv(am).prio||0,pe=_bMv(em).prio||0;
    const sa=_bSpeed(A),se=_bSpeed(E);
    const aFirst=pa!==pe?pa>pe:(sa!==se?sa>se:Math.random()<0.5);
    const order=aFirst?[['a',am],['e',em]]:[['e',em],['a',am]];
    for(const [s,m] of order){
      if(_bA().hp<=0||_bE().hp<=0)break;
      await _bUseMove(s,m);
    }
  }else if(_bA().hp>0&&_bE().hp>0)await _bUseMove('e',em);
  let r=await _bFaints();if(r)return r;
  await _bEOT();
  r=await _bFaints();if(r)return r;
  return null;
}

function _bAddStatus(m,k){
  if(k==='sleep')m.st={k,n:ri(1,3)};
  else if(k==='frz')m.st={k,n:ri(1,2)};
  else m.st={k,n:0};
}

// returns false if the move should be cancelled
async function _bPreStatus(u){
  const st=u.st;if(!st)return true;
  if(st.k==='sleep'){
    if(st.n>0){st.n--;_bSfx('status');await _bSay(t('b_sleep',_bName(u)));return false;}
    u.st=null;await _bSay(t('b_wake',_bName(u)));return true;
  }
  if(st.k==='frz'){
    if(st.n>0){st.n--;_bSfx('status');await _bSay(t('b_frz',_bName(u)));return false;}
    u.st=null;await _bSay(t('b_thaw',_bName(u)));return true;
  }
  if(st.k==='para'&&Math.random()<0.25){_bSfx('status');await _bSay(t('b_para',_bName(u)));return false;}
  return true;
}

async function _bUseMove(side,id){
  const B=battle,o=side==='a'?'e':'a';
  const u=side==='a'?_bA():_bE(),tg=side==='a'?_bE():_bA();
  const mv=_bMv(id);
  if(!(await _bPreStatus(u)))return;
  if(side==='a'&&mv.ep&&id!=='tackle')u.ep=Math.max(0,(u.ep||0)-mv.ep);
  await _bSay(t('b_uses',_bName(u),L2(mv.n)));
  // lunge
  B.an[side].lunge=0.3;_bSfx('move');await _bW(220);
  if(mv.a!=null&&Math.random()*100>=mv.a){await _bSay(t('b_miss',_bName(u)));return;}
  if(mv.p>0){
    const us=_bSt(u),ts=_bSt(tg),usp=_bSp(u);
    let eff=1;try{eff=effOf(mv.t,_bSp(tg).t);}catch(e){}
    if(!(eff>=0))eff=1;
    const stab=(mv.t===usp.t||mv.t===usp.c)?1.5:1;
    const crit=Math.random()<1/16;
    const A=us.atk*STG[B.stages[side].atk+2]*(u.st&&u.st.k==='burn'?0.75:1);
    const D=Math.max(1,ts.def*STG[B.stages[o].def+2]);
    let dmg=((2*u.lv/5+2)*mv.p*A/D)/50+2;
    dmg*=stab*eff*(crit?1.5:1)*(0.85+Math.random()*0.15);
    dmg=Math.max(1,Math.floor(dmg));
    if(!isFinite(dmg))dmg=1;
    tg.hp=Math.max(0,tg.hp-dmg);
    _bHitFx(o,mv.t,crit,eff);
    await _bWaitHp();
    if(crit)await _bSay(t('b_crit'));
    if(eff>1)await _bSay(t('b_super'));else if(eff<1)await _bSay(t('b_weak'));
    if(tg.hp>0&&mv.st&&!tg.st&&!_bImmune(tg,mv.st[0])&&Math.random()<_bChance(mv.st[1])){
      _bAddStatus(tg,mv.st[0]);_bSfx('status');await _bSay(t('b_in_'+mv.st[0],_bName(tg)));
    }
    if(mv.buff&&u.hp>0)await _bStage(side,u,mv.buff,true);
    if(mv.debuff&&tg.hp>0&&Math.random()<0.3)await _bStage(o,tg,mv.debuff,true);
    if(mv.heal&&u.hp>0)await _bHeal(side,u,mv.heal,true);
    return;
  }
  // status move
  let did=false;
  if(mv.st){
    const k=mv.st[0];
    if(_bImmune(tg,k)){await _bSay(t('b_immune',_bName(tg)));did=true;}
    else if(!tg.st&&Math.random()<_bChance(mv.st[1]??100)){
      _bAddStatus(tg,k);_bSfx('status');_bPuff(o,mv.t);B.an[o].shake=0.3;await _bSay(t('b_in_'+k,_bName(tg)));did=true;
    }
  }
  if(mv.buff){await _bStage(side,u,mv.buff,false);did=true;}
  if(mv.debuff){await _bStage(o,tg,mv.debuff,false);did=true;}
  if(mv.heal){await _bHeal(side,u,mv.heal,false);did=true;}
  if(!did)await _bSay(t('b_noeff'));
}

async function _bStage(side,m,bd,quiet){
  const B=battle,k=bd[0]==='def'?'def':'atk',d=bd[1]||0;
  const cur=B.stages[side][k],nv=clamp(cur+d,-2,2);
  if(nv===cur){if(!quiet)await _bSay(t((d>0?'b_max_':'b_min_')+k,_bName(m)));return;}
  B.stages[side][k]=nv;
  _bSfx(d>0?'buff':'debuff');_bPuff(side,d>0?'light':'shadow');
  await _bSay(t((d>0?'b_up_':'b_dn_')+k,_bName(m)));
}
async function _bHeal(side,m,f,quiet){
  const mx=_bSt(m).hp;
  if(m.hp>=mx){if(!quiet)await _bSay(t('b_full',_bName(m)));return;}
  m.hp=Math.min(mx,m.hp+Math.max(1,Math.round(mx*f)));
  _bSfx('heal');_bPuff(side,'grass');
  await _bWaitHp();
  await _bSay(t('b_heal',_bName(m)));
}

async function _bEOT(){
  const B=battle;
  for(const side of ['a','e']){
    const m=side==='a'?_bA():_bE();
    if(m.hp<=0||!m.st)continue;
    if(m.st.k==='burn'||m.st.k==='poison'){
      const mx=_bSt(m).hp;
      const d=Math.max(1,Math.floor(mx/(m.st.k==='burn'?16:8)));
      m.hp=Math.max(0,m.hp-d);
      B.an[side].shake=0.3;_bPuff(side,m.st.k==='burn'?'fire':'shadow');_bSfx('status');
      await _bSay(t('b_dot_'+m.st.k,_bName(m)));
      await _bWaitHp();
    }
  }
}

async function _bWaitHp(){
  if(!SET.battleAnim){battle.dA=_bA().hp;battle.dE=_bE().hp;return;}
  const t0=now();let n=0;
  await until(()=>{n++;return !battle||(Math.abs(battle.dA-_bA().hp)<0.5&&Math.abs(battle.dE-_bE().hp)<0.5)||now()-t0>2.5||n>400;});
  if(battle){battle.dA=_bA().hp;battle.dE=_bE().hp;}
}

// ---------- faint resolution ----------
async function _bFaints(){
  const B=battle;
  const E=_bE(),A=_bA();
  const eDown=E.hp<=0,aDown=A.hp<=0;
  if(!eDown&&!aDown)return null;
  if(eDown){
    B.an.e.faintTo=1;_bSfx('faint');await _bW(450);
    await _bSay(t('b_faint',_bName(E)));
    B.showE=false;
    await _bExp(E);
  }
  if(aDown){
    B.an.a.faintTo=1;_bSfx('faint');await _bW(450);
    await _bSay(t('b_faint',_bName(A)));
    B.showA=false;
    if(!game.party.some(m=>m.hp>0)){
      if(eDown&&B.ei+1>=B.team.length){if(B.kind!=='wild')await _bWinMsgs();return 'win';}
      await _bSay(t('b_allfaint'));
      return 'lose';
    }
  }
  if(eDown){
    if(B.ei+1>=B.team.length){
      if(B.kind!=='wild')await _bWinMsgs();
      else await _bJingle('victory');
      return 'win';
    }
    B.ei++;
    B.parts=[];
    if(!aDown)B.parts.push(_bA());
    if(B.final)await _bFinalPhase();
    else await _bSendEnemy(true);
  }
  if(aDown){
    let i=-1;
    for(let g=0;g<20;g++){
      try{i=await teamMenu({mode:'forced',active:B.ai});}catch(e){console.error(e);i=-1;}
      if(i!=null&&i>=0&&game.party[i]&&game.party[i].hp>0)break;
      i=game.party.findIndex(m=>m.hp>0);if(g>2)break;
    }
    if(i<0)i=game.party.findIndex(m=>m.hp>0);
    B.ai=i;
    await _bSendAlly();
  }
  return null;
}

// ---------- exp ----------
function _bExpVal(E){
  const sp=_bSp(E);
  let v=(sp.x||50)*E.lv/5*(battle.kind!=='wild'?1.5:1)*(_bDiff().xp||1);
  v=Math.max(1,Math.round(v));
  return isFinite(v)?v:1;
}
async function _bExp(E){
  const B=battle,base=_bExpVal(E);
  const parts=B.parts.filter(m=>m.hp>0&&game.party.includes(m));
  const others=game.party.filter(m=>m.hp>0&&m!==E&&!parts.includes(m));
  for(const m of parts){await _bSay(t('b_exp',_bName(m),base));await _bGain(m,base);}
  if(others.length){
    const h=Math.max(1,Math.round(base/2));
    await _bSay(t('b_expall',h));
    for(const m of others)await _bGain(m,h);
  }
}
async function _bGain(m,amt){
  const cap=expFor(100);
  m.exp=Math.min(cap,(m.exp||0)+amt);
  let guard=0;
  while(m.lv<100&&m.exp>=expFor(m.lv+1)&&guard++<100){
    const o=_bSt(m);m.lv++;const n=_bSt(m);
    if(m.hp>0)m.hp=clamp(m.hp+(n.hp-o.hp),1,n.hp);
    m.ep=clamp((m.ep||0)+(n.ep-o.ep),0,n.ep);
    if(m===_bA()&&battle)battle.dA=m.hp;
    _bSfx('ok');_bJingle('levelup');
    await _bSay(t('b_lvup',_bName(m),m.lv));
    await _bLearn(m,m.sp,m.lv);
    const ev=_bSp(m).evo;
    if(ev&&m.lv>=ev[0]&&SPECIES[ev[1]])battle.evo.add(m);
  }
}
async function _bLearn(m,sp,lv){
  let ls=[];try{ls=learnset(sp)||[];}catch(e){}
  for(const [l,id] of ls){
    if(l!==lv||!MOVES[id]||m.moves.includes(id))continue;
    let r=null;try{r=learnMove(m,id);}catch(e){r=null;}
    if(!r||!r.learned)continue;
    if(r.forgot)await _bSay(t('b_forgot',_bName(m),L2(_bMv(r.forgot).n),L2(_bMv(id).n)));
    else await _bSay(t('b_learn',_bName(m),L2(_bMv(id).n)));
  }
}

// ---------- catch ----------
async function _bCatch(id){
  const B=battle,E=_bE(),it=ITEMS[id]||{catch:1};
  game.items[id]=(game.items[id]||0)-1;if(game.items[id]<=0)delete game.items[id];
  await _bSay(t('b_throw',_bPartyName(),L2(it.n)||id));
  B.orb={id,ph:'fly',t0:now(),rot:0};_bSfx('move');
  await _bW(650);
  B.orb.ph='open';B.orb.t0=now();B.an.e.suckTo=1;_bSfx('catch');
  if(!SET.battleAnim)B.an.e.suck=1;
  await _bW(550);
  B.an.e.vis=false;B.orb.ph='drop';B.orb.t0=now();
  await _bW(400);
  const mx=_bSt(E).hp;
  let p=(_bSp(E).cr??0.3)*(it.catch||1)*(1-2/3*clamp(E.hp/mx,0,1))*(E.st?1.5:1);
  if(_bSp(E).boss)p*=0.1;
  p=clamp(isFinite(p)?p:0.2,0.01,1);
  const ok=Math.random()<p;
  const shakes=ok?3:clamp(Math.floor(p*3+Math.random()*1.5),0,2);
  for(let i=0;i<shakes;i++){B.orb.ph='shake';B.orb.t0=now();_bSfx('shake');await _bW(750);B.orb.ph='rest';await _bW(150);}
  if(ok){
    B.orb.ph='done';_bSfx('catch');
    await _bJingle('caught');
    delete E.mul;
    game.caught=game.caught||{};game.caught[E.sp]=true;_bSeen(E);
    await _bSay(t('b_caught',_bName(E)));
    if(game.party.length<6)game.party.push(E);
    else{game.box=game.box||[];game.box.push(E);await _bSay(t('b_tobox',_bName(E)));}
    try{await _bExp(E);}catch(e){}
    return true;
  }
  B.orb=null;B.an.e.vis=true;B.an.e.suckTo=0;B.an.e.flash=0.6;_bSfx('back');
  if(!SET.battleAnim)B.an.e.suck=0;
  await _bW(300);
  await _bSay(t('b_break'+shakes));
  return false;
}

// ---------- evolution ----------
async function _bEvolve(m){
  const B=battle,from=m.sp,ev=_bSp(m).evo;
  if(!ev||!SPECIES[ev[1]])return;
  const to=ev[1],oldName=_bName(m);
  await _bSay(t('b_evo1',oldName));
  B.ev={from,to,t0:now(),done:false};
  _bSfx('evolve');
  await _bW(3400);
  const o=_bSt(m);m.sp=to;const n=_bSt(m);
  m.hp=clamp(n.hp-(o.hp-m.hp),m.hp>0?1:0,n.hp);
  m.ep=clamp((m.ep||0)+(n.ep-o.ep),0,n.ep);
  B.ev.done=true;B.ev.t1=now();B.flash=1;
  game.seen=game.seen||{};game.caught=game.caught||{};game.seen[to]=true;game.caught[to]=true;
  await _bJingle('evolve');
  await _bSay(t('b_evo2',oldName,_bName(m)));
  await _bLearn(m,to,m.lv);
  B.ev=null;
}

// ---------- fx helpers ----------
function _bPos(side){return side==='e'?{x:340,y:122}:{x:120,y:210};}
function _bTypeCol(tp){return (typeof TYPE_COL!=='undefined'&&TYPE_COL[tp])||'#ffffff';}
function _bHitFx(side,tp,crit,eff){
  const B=battle;
  B.an[side].shake=crit?0.55:0.35;B.an[side].blink=0.5;
  _bSfx(crit?'crit':eff<1?'weak':'hit');
  if(crit){_bRumble(80);if(SET.shake)fx.shake=Math.max(fx.shake,8);}
  else if(SET.shake)fx.shake=Math.max(fx.shake,eff>1?5:3);
  _bBurst(side,_bTypeCol(tp),crit?26:16);
}
function _bPuff(side,tp){_bBurst(side,_bTypeCol(tp),10,true);}
function _bBurst(side,col,n,up){
  if(!SET.particles||!battle)return;
  const p=_bPos(side),hh=side==='e'?36:36;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=30+Math.random()*70;
    battle.particles.push({x:p.x+(Math.random()-.5)*20,y:p.y-hh+(Math.random()-.5)*20,vx:Math.cos(a)*s,vy:up?-20-Math.random()*50:Math.sin(a)*s,
      life:0.5+Math.random()*0.4,max:0.9,col:Math.random()<0.3?'#ffffff':col,sz:Math.random()<0.5?2:3,g:up?-20:60});
  }
  if(battle.particles.length>300)battle.particles.splice(0,battle.particles.length-300);
}

// ---------- update ----------
function _bApproach(v,to,sp,dt){return v<to?Math.min(to,v+sp*dt):Math.max(to,v-sp*dt);}
function battleUpdate(dt){
  const B=battle;if(!B||!game)return;
  const A=game.party[B.ai],E=B.team[B.ei];
  if(A){const mx=_bSt(A).hp;B.dA=_bApproach(B.dA,A.hp,Math.max(20,mx*0.9),dt);}
  if(E){const mx=_bSt(E).hp;B.dE=_bApproach(B.dE,E.hp,Math.max(20,mx*0.9),dt);}
  for(const k of ['a','e']){
    const a=B.an[k];
    a.lunge=Math.max(0,a.lunge-dt);a.shake=Math.max(0,a.shake-dt);a.blink=Math.max(0,a.blink-dt);a.flash=Math.max(0,a.flash-dt*2);
    a.faint=_bApproach(a.faint,a.faintTo,2.6,dt);a.app=_bApproach(a.app,a.appTo,3.2,dt);a.suck=_bApproach(a.suck,a.suckTo,2.4,dt);
  }
  B.flash=Math.max(0,B.flash-dt*1.2);
  const ps=B.particles;
  for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.life-=dt;if(p.life<=0){ps.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=1-2*dt;}
}

// ---------- render ----------
const _bWhiteCache=new Map();
function _bWhite(spr){
  let c=_bWhiteCache.get(spr);if(c)return c;
  c=document.createElement('canvas');c.width=spr.width;c.height=spr.height;
  const g=c.getContext('2d');g.drawImage(spr,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  _bWhiteCache.set(spr,c);return c;
}
function _bSprite(sp){try{return monSprite(sp);}catch(e){return null;}}

function _bDrawMon(side,tm){
  const B=battle,m=side==='e'?B.team[B.ei]:game.party[B.ai],an=B.an[side];
  if(!m||!an.vis)return;
  const spr=_bSprite(m.sp);if(!spr)return;
  const sc=3,w=spr.width*sc,h=spr.height*sc,p=_bPos(side);
  let x=p.x,y=p.y;
  const idle=an.faint<=0&&an.lunge<=0&&!B.over;
  if(idle)y+=Math.round(Math.sin(tm*(side==='e'?2.6:3.1))*1.5);
  if(an.lunge>0){const k=Math.sin((1-an.lunge/0.3)*Math.PI)*16;x+=side==='a'?k:-k;y+=side==='a'?-k*0.4:k*0.4;}
  if(an.shake>0)x+=Math.round(Math.sin(tm*70)*3*Math.min(1,an.shake*3));
  if(an.blink>0&&Math.floor(tm*18)%2===0)return;
  const s=Math.max(0,an.app*(1-an.suck));
  if(s<=0.01)return;
  ctx.save();
  if(an.faint>0){ctx.beginPath();ctx.rect(x-w,0,w*2,p.y+2);ctx.clip();y+=an.faint*h;}
  // shadow
  ctx.globalAlpha=0.25*(1-an.faint);ctx.fillStyle='#000';ctx.beginPath();
  if(ctx.ellipse)ctx.ellipse(p.x,p.y,w*0.32,5,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.translate(Math.round(x),Math.round(y));
  if(an.suck>0&&side==='e'){ctx.translate(0,-h*0.5*an.suck);}
  ctx.scale(side==='a'?-s:s,s);
  const white=(an.app<1||an.suck>0||an.flash>0&&Math.floor(tm*16)%2===0);
  ctx.drawImage(white?_bWhite(spr):spr,-w/2,-h,w,h);
  ctx.restore();
}

function _bOrbCol(id){return id==='uorb'?'#e8c040':id==='gorb'?'#4080e0':'#e04040';}
function _bDrawOrb(x,y,id,rot){
  ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(rot||0);
  ctx.fillStyle='#202020';ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=_bOrbCol(id);ctx.beginPath();ctx.arc(0,0,5,Math.PI,0);ctx.fill();
  ctx.fillStyle='#f4f4f4';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI);ctx.fill();
  ctx.fillStyle='#202020';ctx.fillRect(-5,-1,10,2);ctx.fillStyle='#fff';ctx.fillRect(-1,-1,2,2);
  ctx.restore();
}
function _bRenderOrb(tm){
  const o=battle.orb;if(!o)return;
  const tx=340,ty=80,gy=116,e=tm-o.t0;
  if(o.ph==='fly'){const k=clamp(e/0.6,0,1);const x=lerp(110,tx,k),y=lerp(190,ty,k)-Math.sin(k*Math.PI)*70;_bDrawOrb(x,y,o.id,k*12);}
  else if(o.ph==='open'){_bDrawOrb(tx,ty,o.id,0);
    ctx.save();ctx.globalAlpha=0.5*(1-clamp(e/0.5,0,1));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tx,ty,10+e*60,0,Math.PI*2);ctx.fill();ctx.restore();}
  else if(o.ph==='drop'){const k=clamp(e/0.35,0,1);const b=k<1?Math.abs(Math.sin(k*Math.PI*1.5))*(1-k)*12:0;_bDrawOrb(tx,lerp(ty,gy,Math.min(1,k*1.4))-b,o.id,0);}
  else if(o.ph==='shake'){_bDrawOrb(tx,gy,o.id,Math.sin(e*14)*0.5*(e<0.6?1:0));}
  else{_bDrawOrb(tx,gy,o.id,0);if(o.ph==='done'){ctx.fillStyle='#ffe070';for(let i=0;i<3;i++){const a=tm*3+i*2.1;ctx.fillRect(tx+Math.cos(a)*12-1,gy-10+Math.sin(a)*5,2,2);}}}
}

function _bRenderEvo(tm){
  const B=battle,ev=B.ev;
  const g=ctx.createLinearGradient?ctx.createLinearGradient(0,0,0,H):null;
  if(g&&g.addColorStop){g.addColorStop(0,'#101830');g.addColorStop(1,'#402850');ctx.fillStyle=g;}else ctx.fillStyle='#181830';
  ctx.fillRect(0,0,W,H);
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2+tm*0.6;ctx.fillStyle=i%2?'#ffffff22':'#ffe08022';ctx.fillRect(W/2+Math.cos(a)*(80+Math.sin(tm*2+i)*20),110+Math.sin(a)*60,3,3);}
  const e=tm-ev.t0;
  let sp=ev.from,white=false;
  if(!ev.done){white=e>0.6;if(white){const f=Math.min(12,1+e*3);const ph=Math.sin(e*f*Math.PI);sp=ph>0?ev.from:ev.to;}}
  else{sp=ev.to;white=(tm-(ev.t1||tm))<0.3;}
  const spr=_bSprite(sp);
  if(spr){const sc=4,w=spr.width*sc,h=spr.height*sc;const k=white&&!ev.done?0.9+0.1*Math.abs(Math.sin(e*6)):1;
    ctx.save();ctx.translate(W/2,150);ctx.scale(k,k);ctx.drawImage(white?_bWhite(spr):spr,-w/2,-h,w,h);ctx.restore();}
  if(B.flash>0){ctx.save();ctx.globalAlpha=clamp(B.flash,0,1);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore();}
}

function battleRender(){
  const B=battle;if(!B||!game)return;
  const tm=now();
  ctx.save();
  if(B.ev){_bRenderEvo(tm);ctx.restore();return;}
  let th=null;try{th=(typeof world!=='undefined'&&world&&world.th)||(typeof THEMES!=='undefined'?THEMES.meadow:null);}catch(e){}
  let _arena=false;
  if(B.kind==='boss'&&typeof drawBossArena==='function'&&typeof world!=='undefined'&&world){try{drawBossArena(ctx,world.li,tm,(B.final&&B.ei>0)?2:1);_arena=true;}catch(e){_arena=false;}}
  if(!_arena)try{drawBattleBg(ctx,th,tm);}catch(e){ctx.fillStyle='#88c8e8';ctx.fillRect(0,0,W,H/2);ctx.fillStyle='#78c060';ctx.fillRect(0,H/2,W,H/2);}
  _bDrawMon('e',tm);
  _bDrawMon('a',tm);

  for(const p of B.particles){ctx.globalAlpha=clamp(p.life/0.5,0,1);ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz);}
  ctx.globalAlpha=1;
  const E=B.team[B.ei],A=game.party[B.ai];
  try{
    if(B.showE&&E)_bInfoE(E);
    if(B.showA&&A)_bInfoA(A);
    if(B.mvInfo)_bMoveInfo(B.mvInfo);
  }catch(e){}
  if(B.flash>0){ctx.globalAlpha=clamp(B.flash,0,1);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.restore();
}

let world=null;
let _wBusy=0;
const _wDirOpp={up:'down',down:'up',left:'right',right:'left'};
function _wSfx(n){try{if(typeof sfx==='function')sfx(n);}catch(e){}}
function _wHeld(a){try{return typeof isHeld==='function'&&isHeld(a);}catch(e){return false;}}
function _wLv(li){if(!game.lv)game.lv={};let s=game.lv[li];if(!s){s=game.lv[li]={c:[],tr:[],boss:false};}
  if(!s.c)s.c=[];if(!s.tr)s.tr=[];if(!s.sh)s.sh=[];return s;}
function _wMul(){const d=(typeof DIFF!=='undefined'&&DIFF[SET.difficulty|0])||{mul:1};return d.mul||1;}
function _wMon(sp,lv){const m=createMon(sp,lv);const k=_wMul();if(k!==1){m.mul={hp:k,atk:k,def:k};healMon(m);}return m;}
function _wHealAll(){if(game&&game.party)for(const m of game.party)healMon(m);}
async function _wAct(fn){if(_wBusy)return;_wBusy++;try{await fn();}catch(e){console.error(e);}finally{_wBusy--;}}
function _wSay(s){return say(s);}

// ---------------- camera ----------------
function _wNewCam(){return{zoom:1,tzoom:1,rot:0,targetRot:0,panX:0,panY:0,recenter:false,fx:0,fy:0};}
function _wRotSpd(){return[0,1.1,1.9,2.9,4.2][clamp(SET.rotSpeed|0,1,4)];}
function _wFocus(){const w=world,p=w.p,c=w.cam;const px=lerp(p.x,p.tx,p.moving?p.prog:0)*TS+TS/2,py=lerp(p.y,p.ty,p.moving?p.prog:0)*TS+TS/2;
  let fx=px+c.panX,fy=py+c.panY;
  if(Math.abs(Math.sin(c.rot))<0.002&&Math.cos(c.rot)>0){const q=c.zoom*(RS||1);fx=Math.round(fx*q)/q;fy=Math.round(fy*q)/q;}
  c.fx=fx;c.fy=fy;return[fx,fy];}
function worldToScreen(wx,wy){const c=world.cam,co=Math.cos(c.rot),si=Math.sin(c.rot),dx=wx-c.fx,dy=wy-c.fy;
  return[W/2+c.zoom*(co*dx-si*dy),H/2+c.zoom*(si*dx+co*dy)];}
function screenToWorld(x,y){const c=world.cam,co=Math.cos(c.rot),si=Math.sin(c.rot),dx=x-W/2,dy=y-H/2;
  return[(co*dx+si*dy)/c.zoom+c.fx,(-si*dx+co*dy)/c.zoom+c.fy];}
function screenToTile(x,y){const[wx,wy]=screenToWorld(x,y);return[Math.floor(wx/TS),Math.floor(wy/TS)];}
function _wZoomBy(f,ax,ay){const c=world.cam;const nz=clamp(c.tzoom*f,0.5,3);
  if(ax==null){c.tzoom=nz;return;}
  const[w0x,w0y]=screenToWorld(ax,ay);c.zoom=c.tzoom=nz;const[w1x,w1y]=screenToWorld(ax,ay);
  c.panX+=w0x-w1x;c.panY+=w0y-w1y;c.recenter=false;}
function camReset(){if(!world)return;const c=world.cam;c.tzoom=1;c.targetRot=Math.round(c.rot/(2*Math.PI))*2*Math.PI;c.recenter=true;}
function _wCamUpdate(dt){
  const c=world.cam,sp=_wRotSpd();
  if(!ui.length||scene==='world'){
    if(_wHeld('rotL'))c.targetRot-=sp*dt;
    if(_wHeld('rotR'))c.targetRot+=sp*dt;
    if(typeof axisCam==='function'){const a=axisCam()||{x:0,y:0};if(Math.abs(a.x)>0.15)c.targetRot+=a.x*sp*dt;
      if(Math.abs(a.y)>0.15)c.tzoom=clamp(c.tzoom*Math.exp(-a.y*dt*1.6),0.5,3);}
  }
  c.rot+=(c.targetRot-c.rot)*Math.min(1,dt*12);if(Math.abs(c.targetRot-c.rot)<1e-4)c.rot=c.targetRot;
  c.zoom+=(c.tzoom-c.zoom)*Math.min(1,dt*10);if(Math.abs(c.tzoom-c.zoom)<1e-4)c.zoom=c.tzoom;
  if(c.recenter){const k=Math.exp(-dt*6);c.panX*=k;c.panY*=k;if(Math.hypot(c.panX,c.panY)<0.3){c.panX=c.panY=0;c.recenter=false;}}
  // keep rotation numbers bounded (only when settled)
  if(c.rot===c.targetRot&&Math.abs(c.rot)>Math.PI*8){const k=Math.round(c.rot/(2*Math.PI))*2*Math.PI;c.rot-=k;c.targetRot-=k;}
}

// ---------------- level entry ----------------
function _wBuild(li){
  const L=LEVELS[li],th=THEMES[L.theme]||THEMES.meadow||{};
  const map=genLevel(li),st=_wLv(li);
  st.c.forEach(ci=>{const ch=map.chests[ci];if(ch)setTile(map,ch.x,ch.y,T_CHEST_OPEN);});
  const portals=[];for(let y=0;y<map.h;y++)for(let x=0;x<map.w;x++)if(tileAt(map,x,y)===T_PORTAL)portals.push({x,y});
  const bossAlive=!st.boss;
  if(!bossAlive){setTile(map,map.boss.x,map.boss.y,T_PORTAL);portals.push({x:map.boss.x,y:map.boss.y});}
  const mc=paintMap(map,th);
  const npcs=(map.npcs||[]).map((n,i)=>Object.assign({i},n));
  let spr=null;try{spr=monSprite(L.boss);}catch(e){}
  const old=world&&world.cam;
  return{li,L,th,map,mc,npcs,st,
    p:{x:map.start.x,y:map.start.y,tx:map.start.x,ty:map.start.y,moving:false,prog:0,dir:'down',walkT:0},
    boss:{x:map.boss.x,y:map.boss.y,alive:bossAlive,sp:L.boss,spr},
    portalActive:!bossAlive,portals,
    cam:old?Object.assign(old,{panX:0,panY:0,recenter:false}):_wNewCam(),
    path:[],pathAct:null,target:null,hover:null,parts:[],steps:0,encSteps:0,
    heldDir:null,turnWait:0,chain:false,bumpT:0,drag:null,dark:null,mapView:null};
}
function _wValidPos(w,x,y){return x>=0&&y>=0&&x<w.map.w&&y<w.map.h&&passable(tileAt(w.map,x,y))&&!_wNpcAt(x,y,w)&&!(w.boss.alive&&w.boss.x===x&&w.boss.y===y);}
async function enterLevel(li,o){
  o=o||{};_wBusy++;
  try{
    if(scene==='world'||scene==='story'||scene==='battle')await transition('in');
    li=clamp(li|0,0,LEVELS.length-1);
    world=_wBuild(li);
    const w=world,p=w.p;
    if(o.pos&&o.pos.li===li&&_wValidPos(w,o.pos.x,o.pos.y)){p.x=p.tx=o.pos.x;p.y=p.ty=o.pos.y;}
    game.pos={li,x:p.x,y:p.y};
    if(!o.pos||!game.cp||game.cp.x<0)game.cp={li,x:w.map.start.x,y:w.map.start.y};
    if(o.heal)_wHealAll();
    scene='world';
    try{playMusic(w.L.music);}catch(e){}
    autoSave();
    await transition('out');
    const first=!w.st.intro;
    const bn=banner(t('w_chapter',w.L.roman),L2(w.L.name));
    if(first){await bn;w.st.intro=true;await say(L2(w.L.intro));autoSave();}
  }catch(e){console.error(e);}
  finally{_wBusy--;}
}
function resumeGame(){if(!game)return Promise.resolve();const ps=game.pos||{li:0,x:-1,y:-1};return enterLevel(ps.li|0,{pos:Object.assign({},ps)});}

async function startNewGame(slot){
  game=newSave();game.slot=slot||1;scene='story';world=null;
  try{playMusic('story');}catch(e){}
  _wBusy++;
  try{
    await sleep(400);
    for(const k of['w_pro1','w_pro2','w_pro3','w_pro4','w_pro5'])await say(t(k));
    let id;
    for(;;){const i=await pickStarter(STARTERS);id=STARTERS[clamp(i|0,0,STARTERS.length-1)];
      if(await ask(t('w_starter_q',L2(SPECIES[id]?SPECIES[id].name:id))))break;}
    const m=createMon(id,5);game.party=[m];game.seen[id]=true;game.caught[id]=true;
    _wSfx('ok');
    await say(t('w_starter_ok',monName(m)));
    await say(t('w_pro6'));await say(t('w_pro7'));
    saveToSlot(game.slot);
  }catch(e){console.error(e);}
  finally{_wBusy--;}
  await enterLevel(0,{});
}

// ---------------- queries ----------------
function _wNpcAt(x,y,w){w=w||world;for(const n of w.npcs)if(n.x===x&&n.y===y)return n;return null;}
function _wBlocked(x,y){const w=world,m=w.map;if(x<0||y<0||x>=m.w||y>=m.h)return true;
  if(!passable(tileAt(m,x,y)))return true;if(_wNpcAt(x,y))return true;if(w.boss.alive&&w.boss.x===x&&w.boss.y===y)return true;return false;}
function _wIsPortal(x,y){return world.portals.some(q=>q.x===x&&q.y===y);}
function _wInteractable(x,y){const w=world;if(_wNpcAt(x,y))return true;if(w.boss.alive&&w.boss.x===x&&w.boss.y===y)return true;
  const tl=tileAt(w.map,x,y);return tl===T_CHEST||tl===T_CHEST_OPEN||tl===T_SHRINE;}
function _wFindPath(sx,sy,goal,maxN){
  const m=world.map,Wd=m.w,N=m.w*m.h,prev=new Int32Array(N).fill(-2),q=new Int32Array(N);let h=0,tl=0;
  const s=sy*Wd+sx;prev[s]=-1;q[tl++]=s;let found=-1,cnt=0;maxN=maxN||N;
  while(h<tl&&cnt++<maxN){const c=q[h++],cx=c%Wd,cy=(c/Wd)|0;if(goal(cx,cy)){found=c;break;}
    for(const k in DIRS){const nx=cx+DIRS[k][0],ny=cy+DIRS[k][1];if(nx<0||ny<0||nx>=m.w||ny>=m.h)continue;const ni=ny*Wd+nx;
      if(prev[ni]!==-2||_wBlocked(nx,ny))continue;prev[ni]=c;q[tl++]=ni;}}
  if(found<0)return null;const out=[];for(let c=found;c!==s;c=prev[c])out.push([c%Wd,(c/Wd)|0]);return out.reverse();}
function _wDirTo(ax,ay,bx,by){const dx=bx-ax,dy=by-ay;return Math.abs(dx)>=Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}

// ---------------- movement ----------------
function _wWantDir(){
  let ix=0,iy=0;
  if(_wHeld('left'))ix-=1;if(_wHeld('right'))ix+=1;if(_wHeld('up'))iy-=1;if(_wHeld('down'))iy+=1;
  if(!ix&&!iy&&typeof axisMove==='function'){const a=axisMove()||{x:0,y:0};if(Math.hypot(a.x,a.y)>0.35){ix=a.x;iy=a.y;}}
  if(!ix&&!iy)return null;
  let wx=ix,wy=iy;
  if(SET.camRelative){const r=world.cam.rot,c=Math.cos(r),s=Math.sin(r);wx=c*ix+s*iy;wy=-s*ix+c*iy;}
  const ax=Math.abs(wx),ay=Math.abs(wy),cur=world.p.dir;
  if(Math.abs(ax-ay)<0.05){const[cx,cy]=DIRS[cur];if((cx&&Math.sign(cx)===Math.sign(wx))||(cy&&Math.sign(cy)===Math.sign(wy)))return cur;}
  return ax>ay?(wx>0?'right':'left'):(wy>0?'down':'up');
}
function _wTryStep(d){
  const w=world,p=w.p;p.dir=d;const nx=p.x+DIRS[d][0],ny=p.y+DIRS[d][1];
  if(_wBlocked(nx,ny)){if(w.bumpT<=0){_wSfx('bump');w.bumpT=0.38;}return false;}
  p.tx=nx;p.ty=ny;p.moving=true;p.prog=0;p.walkT^=1;
  if(w.cam.panX||w.cam.panY)w.cam.recenter=true;
  return true;
}
function _wOnStep(){
  const w=world,p=w.p;w.steps++;w.encSteps++;
  game.pos={li:w.li,x:p.x,y:p.y};
  if(w.target&&w.target.x===p.x&&w.target.y===p.y&&!w.path.length)w.target=null;
  if(w.steps%50===0)autoSave();
  if(_wIsPortal(p.x,p.y)){w.path.length=0;w.pathAct=null;_wAct(_wPortal);return;}
  if(tileAt(w.map,p.x,p.y)===T_GRASS&&w.encSteps>=3){
    const rate=0.09*[0.5,1,1.7][clamp(SET.encounter|0,0,2)];
    if(Math.random()<rate){w.encSteps=0;w.path.length=0;w.pathAct=null;w.target=null;_wAct(_wWild);}
  }
}
async function _wWild(){
  const L=world.L;const sp=pick(L.pool);const lv=ri(L.lv[0],L.lv[1]);
  _wSfx('enc');
  const r=await runBattle({kind:'wild',team:[_wMon(sp,lv)]});
  if(r==='lose')await _wDie();
}
function worldUpdate(dt){
  const w=world;if(!w)return;
  _wCamUpdate(dt);_wParticles(dt);
  w.bumpT-=dt;
  const p=w.p;
  if(p.moving){
    const spd=(_wHeld('run')||_wHeld('back'))?8:4.5;
    p.prog+=spd*dt;
    if(p.prog>=1){p.x=p.tx;p.y=p.ty;p.moving=false;p.prog=0;w.chain=true;_wOnStep();}
    else return;
  }
  const free=!_wBusy&&!ui.length&&scene==='world';
  if(!free){w.chain=false;w.heldDir=null;return;}
  const d=_wWantDir();
  if(d){
    if(w.path.length||w.pathAct){w.path.length=0;w.pathAct=null;w.target=null;}
    if(d!==w.heldDir){w.heldDir=d;if(d!==p.dir&&!w.chain){p.dir=d;w.turnWait=0.09;}}
    if(w.turnWait>0){w.turnWait-=dt;w.chain=false;return;}
    _wTryStep(d);w.chain=false;return;
  }
  w.heldDir=null;w.turnWait=0;w.chain=false;
  if(w.path.length){const[nx,ny]=w.path.shift();
    if(Math.abs(nx-p.x)+Math.abs(ny-p.y)!==1||_wBlocked(nx,ny)){w.path.length=0;w.pathAct=null;w.target=null;return;}
    _wTryStep(_wDirTo(p.x,p.y,nx,ny));return;}
  if(w.pathAct){const a=w.pathAct;w.pathAct=null;w.target=null;
    if(Math.abs(a.x-p.x)+Math.abs(a.y-p.y)===1){p.dir=_wDirTo(p.x,p.y,a.x,a.y);_wAct(()=>_wInteractAt(a.x,a.y));}}
}

// ---------------- interactions ----------------
function _wFacing(){const p=world.p;return[p.x+DIRS[p.dir][0],p.y+DIRS[p.dir][1]];}
async function _wInteractAt(x,y){
  const w=world,m=w.map,li=w.li,L=w.L;
  const n=_wNpcAt(x,y);
  if(n)return _wTalk(n);
  if(w.boss.alive&&w.boss.x===x&&w.boss.y===y)return _wBoss();
  const tl=tileAt(m,x,y);
  if(tl===T_CHEST)return _wChest(x,y);
  if(tl===T_CHEST_OPEN)return say(t('w_chest_empty'));
  if(tl===T_SHRINE)return _wShrine();
  if(_wIsPortal(x,y))return _wPortal();
}
function _wNm(nm,s){return nm?nm+': '+s:s;}
async function _wTalk(n){
  const w=world,L=w.L,p=w.p;n.dir=_wDirOpp[p.dir];
  if(n.kind==='lore'){const l=L.lore&&L.lore[n.idx%(L.lore.length||1)];await say(l?L2(l):'...');return;}
  if(n.kind==='hint'){await say(t('w_hint'+((n.idx+w.li*3)%8)));return;}
  if(n.kind==='shop'){if(typeof shopMenu==='function')await shopMenu(w.li);else await say(t('w_shop_hi'));return;}
  if(n.kind==='trainer'){
    const tr=L.trainers&&L.trainers[n.idx];if(!tr){await say('...');return;}
    const nm=L2(tr.name);
    if(w.st.tr.includes(n.idx)){await say(_wNm(nm,L2(tr.post)));return;}
    await say(_wNm(nm,L2(tr.pre)));
    const team=tr.team.map((sp,i)=>_wMon(sp,(tr.lv|0)+(i===tr.team.length-1&&tr.team.length>1?1:0)));
    const r=await runBattle({kind:'trainer',team,tname:nm,reward:Math.round((tr.lv|0)*35+50)});
    if(r==='lose'){await _wDie();return;}
    if(r==='win'){if(!w.st.tr.includes(n.idx))w.st.tr.push(n.idx);await say(_wNm(nm,L2(tr.post)));autoSave();}
    return;
  }
  await say('...');
}
async function _wChest(x,y){
  const w=world,m=w.map;const ci=m.chests.findIndex(c=>c.x===x&&c.y===y);
  setTile(m,x,y,T_CHEST_OPEN);try{repaintTile(w.mc,m,w.th,x,y);}catch(e){}
  _wSfx('chest');
  if(ci>=0&&!w.st.c.includes(ci))w.st.c.push(ci);
  const lt=(ci>=0&&m.chests[ci].loot)||{gold:50};
  if(lt.item&&typeof ITEMS!=='undefined'&&ITEMS[lt.item]){const k=lt.n||1;game.items[lt.item]=(game.items[lt.item]||0)+k;
    await say(t('w_chest_item',L2(ITEMS[lt.item].n),k));}
  else{const g=lt.gold||50;game.gold+=g;await say(t('w_chest_gold',g));}
  autoSave();
}
async function _wShrine(){
  const w=world,p=w.p;
  if(!(await ask(t('w_shrine_q'))))return;
  const shi=w.map.shrines.findIndex(s=>Math.abs(s.x-p.x)+Math.abs(s.y-p.y)<=1);
  _wHealAll();game.cp={li:w.li,x:p.x,y:p.y};game.pos={li:w.li,x:p.x,y:p.y};saveToSlot(game.slot||1);
  _wSfx('shrine');fx.shake=Math.max(fx.shake,2);
  if(shi>=0&&!w.st.sh.includes(shi)){w.st.sh.push(shi);saveToSlot(game.slot||1);await bigText(t('w_kindled'),{color:'#f3c060',dur:2.6});}
  await say(t('w_rest_done'));
  let idx=0;
  for(;;){
    const r=await menu({items:[t('w_sh_rest'),t('w_sh_box'),t('w_sh_travel'),t('w_sh_leave')],x:W-128,y:8,w:120,idx,title:t('w_shrine_t')});
    if(r<0||r===3)return;idx=r;
    if(r===0){_wHealAll();saveToSlot(game.slot||1);_wSfx('heal');toast(t('w_saved'));}
    else if(r===1){if(typeof boxMenu==='function')await boxMenu();}
    else if(r===2&&typeof openLevelSelect==='function'){const li=await openLevelSelect();
      if(li!=null&&li>=0&&li!==w.li){_wSfx('door');await enterLevel(li,{});return;}}
  }
}
async function _wBoss(){
  const w=world,L=w.L,li=w.li;w.p.dir=_wDirTo(w.p.x,w.p.y,w.boss.x,w.boss.y);
  await say(L2(L.bossLine));
  const team=[_wMon(L.boss,L.bossLv)];
  const b2=L.boss2||(li===9&&SPECIES.eclipsor2?'eclipsor2':null);
  if(b2)team.push(_wMon(b2,L.boss2Lv||L.bossLv+2));
  let tname=L2(L.boss);try{tname=monName(team[0]);}catch(e){}
  const r=await runBattle({kind:'boss',team,final:li===9,reward:(L.bossLv|0)*60,tname});
  if(r==='lose'){await _wDie();return;}
  if(r!=='win')return;
  w.st.boss=true;w.boss.alive=false;w.portalActive=true;
  setTile(w.map,w.boss.x,w.boss.y,T_PORTAL);try{repaintTile(w.mc,w.map,w.th,w.boss.x,w.boss.y);}catch(e){}
  if(!_wIsPortal(w.boss.x,w.boss.y))w.portals.push({x:w.boss.x,y:w.boss.y});
  game.unlocked=Math.min(10,Math.max(game.unlocked||1,li+2));
  if(!game.cleared.includes(li))game.cleared.push(li);
  autoSave();
  try{playJingle('clear');}catch(e){}
  fx.shake=6;
  await bigText(t('w_purified'),{color:'#ffd36b',dur:4});
  await say(t('w_crystal',L.roman,game.cleared.length));
  await say(t('w_portal_open'));
}
async function _wPortal(){
  const w=world;
  if(!w.portalActive){toast(t('w_portal_sealed'));return;}
  if(w.li>=9){if(await ask(t('w_portal_final'))){_wSfx('door');await playEnding();}return;}
  if(await ask(t('w_portal_q'))){_wSfx('door');await enterLevel(w.li+1,{});}

async function _wDie(){
  fx.shake=10;vibrate(200);_wSfx('death');
  try{playJingle('died');}catch(e){}
  await bigText(t('w_died'),{color:'#b01818',dur:4,sub:t('w_died_sub')});

  _wHealAll();
  const cp=game.cp&&game.cp.x>=0?game.cp:{li:world?world.li:0,x:-1,y:-1};

// ---------------- pause / map ----------------
function _wPause(){
  _wAct(async()=>{
    let idx=0;
    for(;;){
      const items=[t('w_m_team'),t('w_m_bag'),t('w_m_dex'),t('w_m_map'),t('w_m_save'),t('w_m_load'),t('w_m_set'),t('w_m_title')];
      _wSfx('ok');
      const r=await menu({items,x:W-124,y:6,w:118,idx,title:t('w_pause')});
      if(r<0)return;idx=r;
      if(r===0)await teamMenu({mode:'world'});
      else if(r===1)await bagMenu({});
      else if(r===2)await bestiaryMenu();
      else if(r===3)await _wMapView();
      else if(r===4)await openSaveLoad('save');
      else if(r===5){const s=await openSaveLoad('load');if(s){await resumeGame();return;}}

}
function _wMapCanvas(){
  const w=world,m=w.map,th=w.th;
  const c=document.createElement('canvas');c.width=m.w;c.height=m.h;const g=c.getContext('2d');
  const col={};col[T_FLOOR]=th.floor;col[T_PATH]=th.path;col[T_GRASS]=th.grass;col[T_DECO]=th.floor2||th.floor;
  col[T_WALL]=th.wallB||th.wallA;col[T_BLOCK]=th.wallA||th.trunk;col[T_CHEST]=th.floor;col[T_CHEST_OPEN]=th.floor;col[T_SHRINE]=th.floor;col[T_PORTAL]=th.floor;
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){g.fillStyle=col[tileAt(m,x,y)]||'#222';g.fillRect(x,y,1,1);}
  return c;
}
function _wMapView(){
  const w=world;let mc=null;try{mc=_wMapCanvas();}catch(e){}
  const wd={t:0,update(dt){this.t+=dt;},
    draw(){
      const m=w.map;ctx.save();ctx.fillStyle='rgba(4,7,15,0.86)';ctx.fillRect(0,0,W,H);
      panel(8,6,W-16,H-12,{dark:true,r:8});
      _wText(t('w_map_t')+'  —  '+w.L.roman+'. '+L2(w.L.name),W/2,13,'#f3d27a','center');
      const s=Math.min((W-40)/m.w,(H-56)/m.h),ox=Math.round(W/2-m.w*s/2),oy=Math.round(30+(H-56-m.h*s)/2);
      ctx.imageSmoothingEnabled=false;if(mc)ctx.drawImage(mc,ox,oy,m.w*s,m.h*s);
      ctx.strokeStyle='rgba(190,215,255,0.6)';ctx.strokeRect(ox-0.5,oy-0.5,m.w*s+1,m.h*s+1);
      const dot=(x,y,c,r)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(ox+(x+0.5)*s-r/2),Math.round(oy+(y+0.5)*s-r/2),r,r);};
      const r=Math.max(3,Math.round(s));
      m.chests.forEach((c,i)=>{if(!w.st.c.includes(i))dot(c.x,c.y,'#e8b040',r);});
      w.npcs.forEach(n=>dot(n.x,n.y,n.kind==='trainer'?'#e05050':n.kind==='shop'?'#50b0ff':'#e8e8e8',r));
      m.shrines.forEach(sh=>{dot(sh.x,sh.y,'#ff8a2a',r+1);dot(sh.x,sh.y,'#ffe090',Math.max(1,r-2));});
      if(w.boss.alive){const bx=ox+(w.boss.x+0.5)*s,by=oy+(w.boss.y+0.5)*s;_wSkull(bx,by);}
      w.portals.forEach(q=>dot(q.x,q.y,w.portalActive?'#c080ff':'#605070',r+1));
      if((this.t*3|0)%2===0){dot(w.p.x,w.p.y,'#ffffff',r+2);dot(w.p.x,w.p.y,'#e03030',r);}
      _wText(t('w_map_close'),W/2,H-20,'#9fb3d6','center');
      ctx.restore();},
    input(){closeWidget(this,0);},
    mouse(ev){if(ev.type==='click'||ev.type==='down'||ev.type==='context'){if(ev.type!=='down')closeWidget(this,0);return true;}return true;}};
  return pushWidget(wd);
}
function _wSkull(x,y){ctx.save();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x,y-1,4.5,0,7);ctx.fill();ctx.fillRect(x-3,y+1,6,4);
  ctx.fillStyle='#f0e8e0';ctx.beginPath();ctx.arc(x,y-1,3.5,0,7);ctx.fill();ctx.fillRect(x-2,y+1,4,3);
  ctx.fillStyle='#000';ctx.fillRect(x-2,y-2,1.5,1.5);ctx.fillRect(x+0.5,y-2,1.5,1.5);ctx.restore();}
function _wText(s,x,y,col,align,sh){ctx.save();ctx.font=typeof FONT!=='undefined'?FONT:'8px monospace';ctx.textBaseline='top';ctx.textAlign=align||'left';
  ctx.fillStyle=sh||'#020614';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);ctx.restore();}

// ---------------- input ----------------
function worldInput(a,rep){
  const w=world;if(!w)return;
  if(a==='zoomIn'){_wZoomBy(1.25);return;}
  if(a==='zoomOut'){_wZoomBy(1/1.25);return;}
  if(a==='camReset'){if(!rep)camReset();return;}
  if(_wBusy||ui.length)return;
  if(a==='up'||a==='down'||a==='left'||a==='right'){if(w.path.length||w.pathAct){w.path.length=0;w.pathAct=null;w.target=null;}return;}
  if(rep)return;
  if(a==='menu'){_wPause();return;}
  if(a==='ok'&&!w.p.moving){const[x,y]=_wFacing();_wAct(()=>_wInteractAt(x,y));}
}
const _wHudBtns=[{k:'menu',x:W-20,y:14},{k:'in',x:W-20,y:32},{k:'out',x:W-20,y:50},{k:'reset',x:W-20,y:68}];
function _wHudVisible(){return typeof lastDevice!=='undefined'&&lastDevice==='mouse';}
function _wHudHit(ev){if(!_wHudVisible())return null;for(const b of _wHudBtns)if(ev.x>=b.x&&ev.x<b.x+16&&ev.y>=b.y&&ev.y<b.y+16)return b.k;return null;}
function worldMouse(ev){
  const w=world;if(!w)return;
  const cam=SET.mouseCam!==false,c=w.cam;
  switch(ev.type){
    case'move':{const[tx,ty]=screenToTile(ev.x,ev.y);w.hover={x:tx,y:ty};w.hoverHud=_wHudHit(ev);break;}
    case'wheel':if(!cam)break;{let d=ev.delta||0;if(SET.invertZoom)d=-d;_wZoomBy(Math.pow(1.15,-d),ev.x,ev.y);}break;
    case'pinch':if(!cam)break;{const nz=clamp(c.tzoom*(ev.scale||1),0.5,3);c.zoom=c.tzoom=nz;c.rot+=ev.rot||0;c.targetRot=c.rot;}break;
    case'down':w.drag={button:ev.button|0,mode:null,moved:false,fresh:!_wBusy&&!ui.length};break;
    case'drag':{if(!cam)break;const dr=w.drag||(w.drag={button:ev.button|0,mode:null});dr.moved=true;
      if(!dr.mode)dr.mode=(dr.button===2||(dr.button===0&&(ev.ctrl||ev.shift)))?'rot':'pan';
      if(dr.mode==='rot'){// rotate: horizontal drag, or angular grab when far from centre
        const px=ev.x-ev.dx,py=ev.y-ev.dy,r0=Math.hypot(px-W/2,py-H/2);
        let da=ev.dx*0.012;
        if(r0>40&&dr.button===2){const a0=Math.atan2(py-H/2,px-W/2),a1=Math.atan2(ev.y-H/2,ev.x-W/2);let q=a1-a0;while(q>Math.PI)q-=2*Math.PI;while(q<-Math.PI)q+=2*Math.PI;da=Math.abs(ev.dx)>=Math.abs(ev.dy)?ev.dx*0.012:q;}
        c.rot+=da;c.targetRot=c.rot;
      }else{const co=Math.cos(c.rot),si=Math.sin(c.rot);c.panX-=(co*ev.dx+si*ev.dy)/c.zoom;c.panY-=(-si*ev.dx+co*ev.dy)/c.zoom;c.recenter=false;}
    }break;
    case'up':{const dr=w.drag;w.drag=null;
      if(ev.button===2&&dr&&dr.fresh&&!dr.moved&&!_wBusy&&!ui.length)_wPause();}break;
    case'dblclick':if(!_wHudHit(ev))camReset();break;
    case'click':{
      const hb=_wHudHit(ev);
      if(hb){if(hb==='menu'){if(!_wBusy&&!ui.length)_wPause();}else if(hb==='in')_wZoomBy(1.25);else if(hb==='out')_wZoomBy(1/1.25);else camReset();break;}
      if(_wBusy||ui.length||!SET.mouseMove)break;
      const[tx,ty]=screenToTile(ev.x,ev.y);_wClickTile(tx,ty);
    }break;
  }
}
function _wClickTile(tx,ty){
  const w=world,p=w.p,m=w.map;
  if(tx<0||ty<0||tx>=m.w||ty>=m.h)return;
  const sx=p.moving?p.tx:p.x,sy=p.moving?p.ty:p.y;
  if(tx===sx&&ty===sy){w.path.length=0;w.pathAct=null;w.target=null;return;}
  if(_wInteractable(tx,ty)){
    if(!p.moving&&Math.abs(tx-p.x)+Math.abs(ty-p.y)===1){p.dir=_wDirTo(p.x,p.y,tx,ty);w.path.length=0;_wAct(()=>_wInteractAt(tx,ty));return;}
    const path=_wFindPath(sx,sy,(x,y)=>Math.abs(x-tx)+Math.abs(y-ty)===1);
    if(!path){_wSfx('deny');w.target={x:tx,y:ty,t:now(),bad:true};return;}
    w.path=path;w.pathAct={x:tx,y:ty};w.target={x:tx,y:ty,t:now()};_wSfx('move');return;
  }
  if(_wBlocked(tx,ty)){_wSfx('deny');w.target={x:tx,y:ty,t:now(),bad:true};return;}
  const path=_wFindPath(sx,sy,(x,y)=>x===tx&&y===ty);
  if(!path){_wSfx('deny');toast(t('w_no_path'));w.target={x:tx,y:ty,t:now(),bad:true};return;}
  w.path=path;w.pathAct=null;w.target={x:tx,y:ty,t:now()};
}

// ---------------- particles ----------------
function _wParticles(dt){
  const w=world,kind=w.th.particles;
  if(!SET.particles||!kind||kind==='none'){w.parts.length=0;return;}
  const max=kind==='fog'?10:kind==='snow'?60:36;
  while(w.parts.length<max){const q={x:Math.random()*W,y:Math.random()*H,ph:Math.random()*6.28,life:0,max:4+Math.random()*6,s:Math.random()};
    if(kind==='snow'||kind==='petal'){if(w.parts.length>max*0.6)q.y=-6;}
    if(kind==='ember'&&w.parts.length>max*0.6)q.y=H+4;
    w.parts.push(q);}
  const tt=now();
  for(let i=w.parts.length-1;i>=0;i--){const q=w.parts[i];q.life+=dt;
    switch(kind){
      case'petal':q.y+=(14+q.s*10)*dt;q.x+=Math.sin(tt*1.5+q.ph)*18*dt+6*dt;break;
      case'snow':q.y+=(16+q.s*22)*dt;q.x+=Math.sin(tt+q.ph)*10*dt;break;
      case'ember':q.y-=(14+q.s*20)*dt;q.x+=Math.sin(tt*2+q.ph)*8*dt;break;
      case'firefly':q.x+=Math.cos(tt*0.7+q.ph)*10*dt;q.y+=Math.sin(tt*0.9+q.ph*2)*8*dt;break;
      case'dust':q.x+=(4+q.s*6)*dt;q.y+=Math.sin(tt+q.ph)*3*dt;break;
      case'fog':q.x+=(5+q.s*5)*dt;break;
      case'spark':q.y-=4*dt;break;
    }
    if(q.life>q.max||q.y>H+10||q.y<-14||q.x>W+60||q.x<-60)w.parts.splice(i,1);}
}
function _wDrawParticles(){
  const w=world,kind=w.th.particles;if(!SET.particles||!w.parts.length)return;
  const tt=now();ctx.save();
  for(const q of w.parts){const a=clamp(Math.min(q.life/0.8,(q.max-q.life)/0.8),0,1);
    switch(kind){
      case'petal':ctx.globalAlpha=a*0.85;ctx.fillStyle=q.s>0.5?'#ffc0d8':'#fff0f4';ctx.fillRect(q.x|0,q.y|0,2+(Math.sin(tt*3+q.ph)>0?1:0),2);break;
      case'snow':ctx.globalAlpha=a*0.9;ctx.fillStyle='#ffffff';const s=q.s>0.7?2:1;ctx.fillRect(q.x|0,q.y|0,s,s);break;
      case'ember':ctx.globalAlpha=a*(0.6+0.4*Math.sin(tt*8+q.ph));ctx.fillStyle=q.s>0.5?'#ffb040':'#ff6020';ctx.fillRect(q.x|0,q.y|0,q.s>0.8?2:1,q.s>0.8?2:1);break;
      case'firefly':{const b=0.5+0.5*Math.sin(tt*3+q.ph*3);ctx.globalAlpha=a*b*0.35;ctx.fillStyle='#d8ff70';ctx.beginPath();ctx.arc(q.x,q.y,3,0,7);ctx.fill();
        ctx.globalAlpha=a*b;ctx.fillRect(q.x|0,q.y|0,1,1);}break;
      case'dust':ctx.globalAlpha=a*0.4;ctx.fillStyle='#e8dcc0';ctx.fillRect(q.x|0,q.y|0,1,1);break;
      case'fog':{ctx.globalAlpha=a*0.13;const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,60+q.s*50);g.addColorStop(0,'#c8d0b8');g.addColorStop(1,'rgba(200,208,184,0)');
        ctx.fillStyle=g;ctx.fillRect(q.x-120,q.y-120,240,240);}break;
      case'spark':{const b=Math.max(0,Math.sin(tt*4+q.ph*5));ctx.globalAlpha=a*b;ctx.fillStyle='#ffffff';ctx.fillRect(q.x|0,(q.y|0)-1,1,3);ctx.fillRect((q.x|0)-1,q.y|0,3,1);}break;
    }}
  ctx.restore();
}

// ---------------- render ----------------
function _wDarkCanvas(){const w=world;if(!w.dark){w.dark=document.createElement('canvas');w.dark.width=W;w.dark.height=H;}return w.dark;}
function _wUpright(ax,ay,fn){ctx.save();ctx.translate(ax,ay);ctx.rotate(-world.cam.rot);fn();ctx.restore();}
function worldRender(){
  const w=world;if(!w)return;
  const c=w.cam,p=w.p,tt=now(),th=w.th,m=w.map;
  const[fx0,fy0]=_wFocus();
  ctx.save();
  ctx.fillStyle=th.voidCol||'#000';ctx.fillRect(-10,-10,W+20,H+20);
  ctx.translate(W/2,H/2);ctx.rotate(c.rot);ctx.scale(c.zoom,c.zoom);ctx.translate(-fx0,-fy0);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(w.mc,0,0);
  // portals

    if(w.boss.alive){const[a,b]=worldToScreen(w.boss.x*TS+8,w.boss.y*TS);hole(a,b,30*c.zoom,0.5);}

  if(w.L.theme==='mire'&&!SET.particles){ctx.save();ctx.fillStyle='rgba(180,190,160,0.08)';ctx.fillRect(0,0,W,H);ctx.restore();}

function _wHud(){
  const w=world,c=w.cam;
  ctx.save();
  const name=w.L.roman+'. '+L2(w.L.name),gold=t('w_gold',game?game.gold:0);
  ctx.font=typeof FONT!=='undefined'?FONT:'8px monospace';
  const bw=Math.max(ctx.measureText(name).width,ctx.measureText(gold).width)+16;
  panel(4,4,bw,30,{dark:true,alpha:0.85,r:6});
  _wText(name,12,9,'#f3d27a');_wText(gold,12,21,'#e8f0ff');
  // compass when rotated
  const rr=((c.rot%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  if(rr>0.02&&rr<2*Math.PI-0.02){const cx=4+bw+14,cy=19;ctx.fillStyle='rgba(8,16,44,0.85)';ctx.beginPath();ctx.arc(cx,cy,10,0,7);ctx.fill();
    ctx.strokeStyle='rgba(190,215,255,0.6)';ctx.lineWidth=1;ctx.stroke();
    ctx.translate(cx,cy);ctx.rotate(c.rot);ctx.fillStyle='#e04040';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(3,0);ctx.lineTo(-3,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e8f0ff';ctx.beginPath();ctx.moveTo(0,8);ctx.lineTo(3,0);ctx.lineTo(-3,0);ctx.closePath();ctx.fill();ctx.setTransform(RS,0,0,RS,0,0);}
  if(Math.abs(c.zoom-1)>0.02){_wText('×'+c.zoom.toFixed(1),4,37,'#9fb3d6');}
  // mouse HUD buttons
  if(_wHudVisible()){for(const b of _wHudBtns){const hv=w.hoverHud===b.k;
    ctx.fillStyle=hv?'rgba(60,110,200,0.9)':'rgba(8,16,44,0.75)';ctx.fillRect(b.x,b.y,16,16);ctx.strokeStyle='rgba(190,215,255,0.6)';ctx.strokeRect(b.x+0.5,b.y+0.5,15,15);
    ctx.fillStyle='#e8f0ff';const x=b.x,y=b.y;
    if(b.k==='menu'){ctx.fillRect(x+4,y+4,8,2);ctx.fillRect(x+4,y+7,8,2);ctx.fillRect(x+4,y+10,8,2);}
    else if(b.k==='in'){ctx.fillRect(x+4,y+7,8,2);ctx.fillRect(x+7,y+4,2,8);}
    else if(b.k==='out'){ctx.fillRect(x+4,y+7,8,2);}
    else{ctx.strokeStyle='#e8f0ff';ctx.beginPath();ctx.arc(x+8,y+8,4,0,7);ctx.stroke();ctx.fillRect(x+7,y+7,2,2);}}}
  // control hint on first realm
  if(w.li===0&&game&&!game.cleared.length&&!ui.length){
    const s=_wHintLine();ctx.font=typeof FONT!=='undefined'?FONT:'8px monospace';const tw=ctx.measureText(s).width,k=Math.min(1,(W-16)/(tw||1));
    ctx.fillStyle='rgba(4,7,15,0.6)';ctx.fillRect(W/2-tw*k/2-6,H-15,tw*k+12,13);
    ctx.save();ctx.translate(W/2,H-12);ctx.scale(k,1);_wText(s,0,0,'#e8f0ff','center');ctx.restore();}
  ctx.restore();
}
function _wHintLine(){
  let d=SET.controlHints&&SET.controlHints!=='auto'?SET.controlHints:(typeof lastDevice!=='undefined'?lastDevice:'keyboard');
  if(d==='keyboard'&&(!SET.controlHints||SET.controlHints==='auto')&&window.matchMedia&&matchMedia('(pointer:coarse)').matches&&!(navigator.keyboard))d='touch';
  if(d==='mouse')return t('w_hint_mouse');if(d==='touch')return t('w_hint_touch');if(d==='pad')return t('w_hint_pad');
  const k=a=>{const c=SET.keys&&SET.keys[a]&&SET.keys[a].find(Boolean);if(!c)return'?';try{return typeof keyName==='function'?keyName(c):c;}catch(e){return c;}};
  const mv=SET.keys&&SET.keys.up&&SET.keys.up.includes('KeyW')?'WASD':'↑↓←→';
  return t('w_hint_kb',mv,k('ok'),k('run'),k('rotL'),k('rotR'),k('menu'));
}

// ---------------- story / ending ----------------
let _wStars=null;
function storyRender(){
  const tt=now();
  const g=ctx.createRadialGradient(W/2,H*0.35,10,W/2,H*0.4,W*0.7);
  g.addColorStop(0,scene==='ending'?'#3a4a8a':'#1b2f6b');g.addColorStop(0.5,'#0a1230');g.addColorStop(1,'#04070f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!_wStars){const r=RNG(777);_wStars=[];for(let i=0;i<110;i++)_wStars.push({x:r()*W,y:r()*H,s:r(),p:r()*6.28});}
  ctx.save();
  for(const s of _wStars){ctx.globalAlpha=0.35+0.65*Math.abs(Math.sin(tt*(0.6+s.s)+s.p));ctx.fillStyle=s.s>0.85?'#ffe8b0':'#dfe8ff';
    ctx.fillRect(s.x|0,s.y|0,s.s>0.9?2:1,s.s>0.9?2:1);}
  ctx.globalAlpha=1;
  // glowing crystal
  const cx=W/2,cy=88+Math.sin(tt*1.3)*4,pul=0.75+0.25*Math.sin(tt*2);
  const gl=ctx.createRadialGradient(cx,cy,2,cx,cy,70);gl.addColorStop(0,'rgba(170,220,255,'+(0.55*pul)+')');gl.addColorStop(0.4,'rgba(90,150,255,'+(0.22*pul)+')');gl.addColorStop(1,'rgba(40,60,160,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(cx,cy,70,0,7);ctx.fill();
  ctx.translate(cx,cy);
  const pts=[[0,-26],[11,-8],[8,16],[0,24],[-8,16],[-11,-8]];
  ctx.fillStyle='#7fc0ff';ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();
  ctx.fillStyle='#c8ecff';ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(11,-8);ctx.lineTo(0,-2);ctx.lineTo(-11,-8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#4a84e0';ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(8,16);ctx.lineTo(0,24);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffffff';ctx.globalAlpha=0.5+0.5*Math.sin(tt*3);ctx.fillRect(-4,-16,2,6);
  ctx.globalAlpha=1;ctx.strokeStyle='rgba(230,245,255,0.8)';ctx.lineWidth=1;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.stroke();
  ctx.restore();
  // rising motes
  ctx.save();for(let i=0;i<14;i++){const ph=(tt*0.15+i/14)%1;ctx.globalAlpha=Math.sin(ph*Math.PI)*0.8;ctx.fillStyle='#bfe4ff';
    ctx.fillRect((cx+Math.sin(i*2.3+tt*0.5)*60)|0,(150-ph*120)|0,1,1);}ctx.restore();
}
async function playEnding(){
  _wBusy++;
  try{
    await transition('in');
    scene='ending';world=null;
    try{playMusic('ending');}catch(e){}
    await transition('out');
    for(const k of['w_epi1','w_epi2','w_epi3','w_epi4'])await say(t(k));
    game.won=true;autoSave();
    if(typeof showCredits==='function')await showCredits({ending:true});
    if(typeof showTitle==='function')showTitle();
  }catch(e){console.error(e);}
  finally{_wBusy--;}
}

.ds-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;overflow:hidden;

 background:radial-gradient(ellipse at 50% 30%,rgba(27,47,107,.93) 0%,rgba(10,18,48,.95) 55%,rgba(4,7,15,.98) 100%);animation:dsFade .22s ease-out}

.ds-ov::before,.ds-ov::after{content:'';position:absolute;left:0;right:0;top:0;height:200%;pointer-events:none;z-index:0;opacity:.75;
 background-image:radial-gradient(1.5px 1.5px at 8% 12%,#fff,transparent),radial-gradient(1px 1px at 22% 38%,#cfe2ff,transparent),radial-gradient(2px 2px at 35% 8%,rgba(255,226,150,.9),transparent),
 radial-gradient(1px 1px at 48% 27%,#fff,transparent),radial-gradient(1.5px 1.5px at 63% 44%,#bcd6ff,transparent),radial-gradient(1px 1px at 77% 16%,#fff,transparent),
 radial-gradient(2px 2px at 88% 35%,rgba(255,226,150,.85),transparent),radial-gradient(1px 1px at 14% 47%,#fff,transparent),radial-gradient(1.5px 1.5px at 56% 4%,#dbe8ff,transparent),
 radial-gradient(1px 1px at 93% 6%,#fff,transparent),radial-gradient(1px 1px at 4% 30%,#bcd6ff,transparent),radial-gradient(1.5px 1.5px at 70% 31%,#fff,transparent);
 background-size:100% 50%;animation:dsDrift 40s linear infinite}
.ds-ov::after{opacity:.45;background-size:70% 35%;animation-duration:26s;filter:blur(.4px)}
.ds-ov>*{position:relative;z-index:1}

@keyframes dsFade{from{opacity:0}to{opacity:1}}
@keyframes dsBlink{0%,100%{opacity:.3}50%{opacity:1}}

 box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 0 26px rgba(120,170,255,.18),0 12px 50px rgba(0,0,0,.6),0 0 0 3px rgba(4,8,22,.55);padding:14px 22px 10px}

// ---------- helpers ----------
function _mEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function _mSfx(n){if(typeof sfx==='function'){try{sfx(n);}catch(e){}}}
function _mDev(){const h=SET.controlHints;if(h&&h!=='auto')return h;return typeof lastDevice!=='undefined'&&lastDevice?lastDevice:'keyboard';}
function _mKey(a){const k=SET.keys&&SET.keys[a];const c=k?(k[0]||k[1]):'';if(!c)return'—';return typeof keyName==='function'?keyName(c):c.replace(/^Key|^Digit/,'');}
function _mPad(a){const k=SET.pad&&SET.pad[a];const b=k?(k[0]>=0?k[0]:k[1]):-1;if(b==null||b<0)return'—';return typeof padBtnName==='function'?padBtnName(b):'B'+b;}
function _mFmtTime(s){s=Math.floor(s||0);const h=Math.floor(s/3600),m=Math.floor(s/60)%60,ss=s%60;return h+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');}
function _mFmtDate(ms){try{return new Date(ms).toLocaleString(LANG==='pl'?'pl-PL':'en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
const _M_ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
function _mRealm(li){const L=typeof LEVELS!=='undefined'&&LEVELS[li];return{roman:(L&&L.roman)||_M_ROMAN[li]||'?',name:L?L2(L.name):'—'};}
const _mThumbs={};
function _mThumb(sp){if(!sp||typeof monSprite!=='function'||(typeof SPECIES!=='undefined'&&!Object.prototype.hasOwnProperty.call(SPECIES,sp)))return'';if(_mThumbs[sp])return _mThumbs[sp];
  try{const c=monSprite(sp);if(!c)return'';const o=document.createElement('canvas');o.width=c.width*2;o.height=c.height*2;const x=o.getContext('2d');x.imageSmoothingEnabled=false;
    x.drawImage(c,0,0,o.width,o.height);return _mThumbs[sp]=o.toDataURL();}catch(e){return'';}}
function dsToast(msg,ms){const r=document.getElementById('ovroot');if(!r)return;const d=document.createElement('div');d.className='ds-toast';d.textContent=msg;r.appendChild(d);
  setTimeout(()=>{d.style.transition='opacity .4s';d.style.opacity='0';setTimeout(()=>d.remove(),450);},ms||2400);}
// push a screen; full screens hide the overlays beneath them (restored on close), modals keep them visible
function _mPush(o){const modal=/ds-modal/.test(o.el.className);const hidden=[];
  if(!modal)for(const u of ovStack)if(u.el&&u.el.style.visibility!=='hidden'){u.el.style.visibility='hidden';hidden.push(u);}
  const oc=o.onClose;o.onClose=()=>{for(const u of hidden)if(u.el)u.el.style.visibility='';oc&&oc();};pushOverlay(o);}
function closeAllOverlays(){let g=50;while(ovStack.length&&g--)popOverlay(ovStack[ovStack.length-1]);}
function _mRefreshAll(){for(const o of ovStack)if(o.refresh)o.refresh();}
function _mApply(){saveSettings();applySettings();if(typeof applyAudio==='function'){try{applyAudio();}catch(e){}}}

// hint bar markup. items: [{a:'ok'|['left','right'], l:'label', act?:fn}]
function _mHints(items){const dev=_mDev();return items.map((h,i)=>{const as=Array.isArray(h.a)?h.a:[h.a];let k;
  if(dev==='touch'||dev==='mouse'){const w=dev==='touch'?t('m_tap'):t('m_click');
    k=as[0]==='ok'?w:as[0]==='back'?'✕':as[0]==='left'?'‹ ›':as[0]==='rotL'?'⇆':as[0]==='up'?'⇅':as[0]==='menu'?'🗑':w;
    return`<span class="ds-hint" data-h="${i}"><kbd>${_mEsc(k)}</kbd>${_mEsc(h.l)}</span>`;}
  const pad=dev==='pad';k=as.map(a=>pad?_mPad(a):_mKey(a)).filter((v,j,arr)=>arr.indexOf(v)===j).join(pad?' ':' / ');
  return`<span class="ds-hint" data-h="${i}"><kbd class="${pad?'pad':''}">${_mEsc(k)}</kbd>${_mEsc(h.l)}</span>`;}).join('');}

// ---------- generic list screen ----------
// cfg: {cls, title(), tabs?(), rows(), hints(), html?(), back:value, noBack, onBack?, onMenu?(row), head?(), wrap?(el,panel) , lr? (left/right move like up/down), close button}
function dsScreen(cfg){

  const o={el,cfg,sel:-1,sub:0,tab:cfg.tab||0,rows:[],capturing:null,done:false,result:cfg.back,_dev:null};

  o.close=v=>{if(o.done)return;o.result=v;popOverlay(o);};
  const selectable=r=>r&&r.type!=='hdr'&&r.type!=='text'&&!r.dis;
  function firstSel(){for(let i=0;i<o.rows.length;i++)if(selectable(o.rows[i]))return i;return -1;}
  o.render=function(){
    const body0=el.querySelector('.ds-body');const st=body0?body0.scrollTop:0;
    o.rows=cfg.rows?cfg.rows(o):[];
    if(o.sel<0||!selectable(o.rows[o.sel])){if(o.sel>=0){let j=o.sel;while(j<o.rows.length&&!selectable(o.rows[j]))j++;if(j>=o.rows.length){j=o.sel;while(j>=0&&!selectable(o.rows[j]))j--;}o.sel=j;}if(o.sel<0)o.sel=firstSel();}
    let h='';

    h+=`<div class="ds-panel">`;
    if(cfg.title)h+=`<div class="ds-head"><div class="ds-title">${_mEsc(cfg.title(o))}</div>${cfg.noX?'':'<div class="ds-x" data-x="1">✕</div>'}</div><div class="ds-line"></div>`;
    if(cfg.q)h+=`<div class="ds-q">${_mEsc(cfg.q)}</div>`;
    if(cfg.tabs){const tb=cfg.tabs(o);const dv=_mDev();const kl=dv==='pad'?_mPad('rotL'):dv==='keyboard'?_mKey('rotL'):'',kr=dv==='pad'?_mPad('rotR'):dv==='keyboard'?_mKey('rotR'):'';
      h+=`<div class="ds-tabs">${kl?`<span class="ds-tabkey">${_mEsc(kl)}</span>`:''}${tb.map((s,i)=>`<div class="ds-tab${i===o.tab?' on':''}" data-tab="${i}">${_mEsc(s)}</div>`).join('')}${kr?`<span class="ds-tabkey">${_mEsc(kr)}</span>`:''}</div><div class="ds-line"></div>`;}
    h+=`<div class="ds-body">${cfg.html?cfg.html(o):''}${o.rows.map((r,i)=>_mRowHTML(o,r,i)).join('')}</div>`;
    if(!cfg.noDesc)h+=`<div class="ds-line"></div><div class="ds-desc"></div>`;
    h+=`<div class="ds-hints"></div></div>`;
    if(cfg.post)h+=cfg.post(o);
    el.innerHTML=h;
    if(cfg.wrap)cfg.wrap(o);
    const body=el.querySelector('.ds-body');body.scrollTop=st;
    o.bind();o.updSel(false);o.updHints();
  };
  o.updHints=function(){o._dev=_mDev();const hb=el.querySelector('.ds-hints');if(!hb)return;const hs=cfg.hints?cfg.hints(o):[];o._hs=hs;hb.innerHTML=_mHints(hs);
    hb.querySelectorAll('.ds-hint').forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();const hh=hs[+n.dataset.h];if(!hh)return;
      if(hh.act)hh.act();else o.input(Array.isArray(hh.a)?hh.a[hh.a.length-1]:hh.a,false);}));};
  o.updSel=function(scroll){{const r0=o.rows[o.sel];if(r0&&r0.subs&&(o.sub>=r0.subs()||(r0.subDis&&r0.subDis(o.sub))))o.sub=_mDefSub(r0);}
    el.querySelectorAll('.ds-row').forEach(n=>{const i=+n.dataset.i;n.classList.toggle('sel',i===o.sel);
      n.querySelectorAll('[data-sub]').forEach(b=>b.classList.toggle('on',i===o.sel&&+b.dataset.sub===o.sub));});
    const d=el.querySelector('.ds-desc');const r=o.rows[o.sel];
    if(d){let s=r&&r.desc!=null?(typeof r.desc==='function'?r.desc():r.desc):(cfg.desc?cfg.desc(o):'');d.textContent=s||' ';}
    if(scroll!==false){const n=el.querySelector(`.ds-row[data-i="${o.sel}"]`);if(n&&n.scrollIntoView)n.scrollIntoView({block:'nearest'});}};
  o.setSel=function(i,sub){if(i===o.sel&&(sub==null||sub===o.sub))return;if(i!==o.sel)o.sub=sub!=null?sub:_mDefSub(o.rows[i]);else o.sub=sub;o.sel=i;o.updSel(false);};
  o.bind=function(){
    const x=el.querySelector('[data-x]');if(x)x.addEventListener('click',e=>{e.stopPropagation();o.input('back',false);});
    el.querySelectorAll('.ds-tab').forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();const i=+n.dataset.tab;if(i!==o.tab){o.tab=i;o.sel=-1;o.sub=0;_mSfx('move');el.querySelector('.ds-body').scrollTop=0;o.render();}}));
    el.querySelectorAll('.ds-row').forEach(n=>{const i=+n.dataset.i,r=o.rows[i];

      n.addEventListener('click',e=>{if(o.capturing||!r)return;if(!selectable(r)){_mSfx('deny');return;}

  g=ctx.createLinearGradient(cx-9,cyy-20,cx+9,cyy+20);g.addColorStop(0,'#fff6d8');g.addColorStop(.5,'#f3c060');g.addColorStop(1,'#9a5a1c');ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.moveTo(cx,cyy-20);ctx.lineTo(cx-9,cyy-2);ctx.lineTo(cx,cyy+2);ctx.closePath();ctx.fill();

        R.push(_rSlider('brightness',50,150,5,v=>v+'%'));R.push(_rBool('shake'));R.push(_rBool('scanlines'));R.push(_rBool('particles'));R.push(_rBool('showFps'));}
      else if(tb===2){const tst=()=>_mSfx('ok');R.push(_rSlider('master',0,100,5,null,tst));R.push(_rSlider('music',0,100,5));R.push(_rSlider('sfx',0,100,5,null,tst));
        R.push(_rBool('bgMute'));R.push(_rBool('customMusic'));
        const T=[['ok','m_t_ok'],['hit','m_t_hit'],['heal','m_t_heal'],['catch','m_t_catch']];
        R.push({type:'btns',cls:'wrap',label:t('m_test'),desc:t('m_d_test'),subs:()=>T.length,subHTML:()=>T.map((x,i)=>`<span class="ds-bt" data-sub="${i}">♪ ${_mEsc(t(x[1]))}</span>`).join(''),act:s=>_mSfx(T[s][0])});}
      else if(tb===3){const upd=()=>{if(typeof updateTouch==='function')updateTouch();};
        R.push(_rOpt('controlHints',['auto','keyboard','pad','touch','mouse'],[t('m_dev_auto'),t('m_dev_keyboard'),t('m_dev_pad'),t('m_dev_touch'),t('m_dev_mouse')],()=>o.render()));
        R.push(_rOpt('touch',['auto','on','off'],[t('m_t_auto'),t('m_t_on'),t('m_t_off')],upd));
        R.push(_rSlider('touchSize',60,160,10,v=>v+'%',upd));R.push(_rSlider('touchOpacity',20,100,5,v=>v+'%',upd));R.push(_rBool('leftHanded',upd));
        R.push(_rBool('vibrate',()=>{if(SET.vibrate)vibrate(40);}));R.push(_rBool('mouseMove'));R.push(_rBool('mouseCam'));R.push(_rBool('invertZoom'));R.push(_rBool('camRelative'));
        R.push(_rSlider('rotSpeed',1,4,1));R.push(_rSlider('padDeadzone',10,60,5,v=>v+'%'));
        R.push(_rBool('padVibrate',()=>{if(SET.padVibrate&&typeof padRumble==='function')padRumble(150);}));
        R.push({type:'info',label:t('m_padName'),desc:t('m_d_padName'),value:()=>{const n=typeof padConnected==='function'?padConnected():null;return n?String(n).slice(0,34):t('m_none');}});
        const acts=typeof ACTIONS!=='undefined'?ACTIONS:['up','down','left','right','ok','back','menu','run','rotL','rotR','zoomIn','zoomOut','camReset'];
        if(!SET.keys)SET.keys={};if(!SET.pad)SET.pad={};
        R.push({type:'hdr',label:t('m_keyboard')});for(const a of acts){const r=_mBindRow('key',a);r._o=o;R.push(r);}
        R.push(_rBtn(t('m_resetKeys'),t('m_d_resetKeys'),()=>{if(typeof resetBindings==='function')resetBindings('key');else if(typeof DEFAULT_KEYS!=='undefined')SET.keys=JSON.parse(JSON.stringify(DEFAULT_KEYS));_mApply();_mSfx('ok');o.render();}));
        R.push({type:'hdr',label:t('m_gamepad')});for(const a of acts){const r=_mBindRow('pad',a);r._o=o;R.push(r);}
        R.push(_rBtn(t('m_resetPad'),t('m_d_resetPad'),()=>{if(typeof resetBindings==='function')resetBindings('pad');else if(typeof DEFAULT_PAD!=='undefined')SET.pad=JSON.parse(JSON.stringify(DEFAULT_PAD));_mApply();_mSfx('ok');o.render();}));}
      else{for(let s=1;s<=SLOTS;s++){const has=!!slotMeta(s);

            subHTML:()=>[t('m_export'),t('m_import'),t('m_delete')].map((x,j)=>`<span class="ds-bt${!has&&j!==1?' dis':''}" data-sub="${j}">${_mEsc(x)}</span>`).join(''),
            act:(j)=>{if(j===0){exportSlot(s);_mSfx('ok');}else if(j===1){_mSfx('ok');_mImport(s,o);}else _mDelete(s,o);}});}
        R.push({type:'hdr',label:t('m_settings')});

      return R;},
    hints:(o)=>{const r=o.rows[o.sel];const H=[{a:['up','down'],l:t('m_select')}];
      if(r&&(r.type==='opt'||r.type==='slider'||r.subs))H.push({a:['left','right'],l:t('m_change')});
      H.push({a:'ok',l:t('m_select')});H.push({a:['rotL','rotR'],l:t('m_tab'),act:()=>o.input('rotR',false)});H.push({a:'back',l:t('m_back')});
      const d=_mDev();return d==='touch'||d==='mouse'?H.filter(h=>h.a!=='ok'&&!(Array.isArray(h.a)&&h.a[0]==='up')):H;},
    tick:(o)=>{if(o.tab===3&&!o.capturing){const r=o.rows.find(r=>r.type==='info');if(r){const n=o.el.querySelector('.ds-row:not(.dis) .ds-val');}
        const cur=typeof padConnected==='function'?padConnected():null;if(cur!==o._pad){o._pad=cur;o.render();}}}});
  // update hints when selection changes (left/right relevance)
  const us=o.updSel;o.updSel=function(sc){us.call(o,sc);if(o._lastHintSel!==o.sel){o._lastHintSel=o.sel;o.updHints();}};
  o.render();_mPush(o);return o.promise;}

// ---------- save / load ----------
function _mSlotCard(s,mode,o){const m=slotMeta(s);
  const del=m?`<span class="ds-del" data-sub="1" title="${_mEsc(t('m_delete'))}">✕</span>`:'';
  if(!m)return`<span class="ds-sn">${s}</span><span class="ds-thumb"></span><span class="ds-si"><span class="e">${_mEsc(t('m_empty'))}</span></span>`;
  const r=_mRealm(m.li),img=_mThumb(m.lead),nm=m.lead&&typeof SPECIES!=='undefined'&&Object.prototype.hasOwnProperty.call(SPECIES,m.lead)?L2(SPECIES[m.lead].name):'';
  return`<span class="ds-sn">${s}</span><span class="ds-thumb">${img?`<img src="${img}" alt="">`:''}</span>
   <span class="ds-si"><span class="a">${_mEsc(r.roman)} · ${_mEsc(r.name)}</span>
   <span class="b"><span>${_mEsc(m.name||'')}${nm?' · '+_mEsc(nm):''} ${_mEsc(t('m_lv',m.lv||0))}</span><span>${_mEsc(t('m_cleared',m.cleared||0))}</span><span>⌛ ${_mFmtTime(m.time)}</span><span>${_mEsc(_mFmtDate(m.date))}</span></span></span>${del}`;}
function openSaveLoad(mode){
  const fromTitle=scene==='title';
  const o=dsScreen({cls:'ds-sl-'+mode,title:()=>mode==='save'?t('m_save'):mode==='load'?t('m_load'):t('m_new'),back:0,
    desc:()=>mode==='save'?t('m_choose_save'):mode==='load'?t('m_choose_load'):t('m_choose_new'),
    rows:()=>{const R=[];for(let s=1;s<=SLOTS;s++){const has=!!slotMeta(s);
      R.push({type:'slot',cls:'ds-slot',dis:mode==='load'&&!has,html:()=>_mSlotCard(s,mode,o),subs:()=>has?2:1,
        desc:()=>{const m=slotMeta(s);return m?null:t('m_d_slot_empty');},
        act:async(j)=>{if(j===1){await _mDelete(s,o);return;}await choose(s);}});}return R;},
    onMenu:(o)=>{const r=o.rows[o.sel];if(r)_mDelete(o.sel+1,o);},
    hints:()=>{const d=_mDev(),H=[];if(d!=='touch'&&d!=='mouse')H.push({a:['up','down'],l:t('m_select')},{a:'ok',l:t('m_select')});
      H.push({a:'menu',l:t('m_delete'),act:()=>o.input('menu',false)},{a:'back',l:t('m_back')});return H;}});
  async function choose(s){const has=!!slotMeta(s);
    if(mode==='save'){if(has&&!(await confirmDS(t('m_q_over',s))))return;if(saveToSlot(s)){_mSfx('save');dsToast(t('m_saved'));o.render();await sleep(350);o.close(s);}else _mSfx('deny');}
    else if(mode==='load'){if(!has){_mSfx('deny');return;}if(!loadFromSlot(s)){_mSfx('deny');return;}_mSfx('ok');o.result=s;
      closeAllOverlays();if(fromTitle){_titleOv=null;if(typeof resumeGame==='function')resumeGame();}}
    else{if(has&&!(await confirmDS(t('m_q_overNew',s))))return;_mSfx('ok');o.result=s;closeAllOverlays();_titleOv=null;if(typeof startNewGame==='function')startNewGame(s);}}
  o.render();
  if(mode!=='load'){// preselect first empty slot for new
    if(mode==='new'){for(let s=1;s<=SLOTS;s++)if(!slotMeta(s)){o.sel=s-1;break;}}else if(game&&game.slot)o.sel=game.slot-1;o.updSel();}
  else{const ls=latestSlot();if(ls){o.sel=ls-1;o.updSel();}}
  _mPush(o);return o.promise;}

// ---------- level select ----------
function openLevelSelect(){
  const n=typeof LEVELS!=='undefined'?LEVELS.length:10;
  const o=dsScreen({cls:'ds-lvl',title:()=>t('m_travel'),back:-1,
    rows:()=>{const R=[];const un=game?game.unlocked||1:1;const cl=game?game.cleared||[]:[];const here=typeof world!=='undefined'&&world&&world.li!=null?world.li:(game&&game.pos?game.pos.li:-1);
      for(let li=0;li<n;li++){const lock=li>=un,r=_mRealm(li),c=cl.indexOf(li)>=0;
        const L=typeof LEVELS!=='undefined'&&LEVELS[li];
        R.push({type:'realm',cls:'ds-realm'+(lock?' lock':''),dis:lock,desc:lock?t('m_d_locked'):(L&&L.intro?L2(L.intro):''),
          html:()=>`<span class="rn">${_mEsc(r.roman)}</span><span class="ds-lab">${lock?t('m_locked'):_mEsc(r.name)}</span><span class="st">${lock?'🔒':li===here?'<span class="here">◆ '+_mEsc(t('m_here'))+'</span>':''}${c?' <span class="ok">✓ '+_mEsc(t('m_clearedT'))+'</span>':''}</span>`,
          act:()=>{_mSfx('ok');o.close(li);}});}return R;},
    hints:()=>{const d=_mDev();return(d==='touch'||d==='mouse')?[{a:'back',l:t('m_back')}]:[{a:['up','down'],l:t('m_select')},{a:'ok',l:t('m_travel')},{a:'back',l:t('m_back')}];}});
  o.render();const here=typeof world!=='undefined'&&world&&world.li!=null?world.li:(game&&game.pos?game.pos.li:0);if(o.rows[here]&&!o.rows[here].dis){o.sel=here;o.updSel();}
  _mPush(o);return o.promise;}

   +row(t('m_h_menu'),k('menu'))+row(t('m_h_run'),k('run'))+row(t('m_h_cam'),k('rotL')+k('rotR')+' · '+k('camReset'))+row(t('m_h_zoom'),k('zoomIn')+k('zoomOut'))+`</table></div>`;
